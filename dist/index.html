/* ---------- 改訂2・7章: 実行本体 ---------- */

/* 6パターンの完了メッセージ(改訂2の3章の表)。「J1〜J3」という文字列を必ず含めることで、
   このボタンが選択中クラブだけでなく全リーグ対象であることを1回見れば分かるようにする。
   一部失敗のときだけ、実際に成功したリーグ名を具体的に列挙する。 */
function ondemandOutcomeMessage(attemptedLeagues, succeededLeagues, changedCount) {
  if (succeededLeagues.size === 0) return "更新できませんでした";
  if (succeededLeagues.size < attemptedLeagues.size) {
    const order = ["j1", "j2", "j3"];
    const labels = order.filter(lg => succeededLeagues.has(lg)).map(lg => LEAGUES[lg].name);
    return "一部のリーグを取得できませんでした（" + labels.join("・") + " のみ更新）";
  }
  if (changedCount > 0) return "J1〜J3 の最新結果を取得しました（" + changedCount + "試合更新）";
  return "最新でした（更新なし）";
}

/* 3リーグぶんの対象節を決め、逐次(300ms間隔)取得してマージする。
   失敗(ネットワーク/CORS/パース失敗)しても例外を投げない(getJsonOptionalと同じ流儀の上に構築)。
   一部だけ成功した場合は成功したぶんだけマージする。
   opts.ignoreCooldown: 第12弾のライブスコア終了検知からの自動実行専用。ボタン連打対策の60秒クールダウンは
   無視するが、state.ondemandRunningによる多重実行防止はそのまま効く(下の1行目のガード)。 */
/* 第15弾: calendar.json/{league}_matches.json/{league}_match_events.jsonは、アプリ起動時に
   1回だけ読み込んでキャッシュする作りだったため、⟳ボタンを押してもバッチが更新した最新の
   スコア・得点速報・ハイライト動画が画面に反映されない問題があった(アプリを完全に閉じて
   開き直すまで反映されなかった)。TheSportsDBのオンデマンド取得(このすぐ下のrunOndemandUpdate
   本体。クールダウン対象)とは別に、こちらは自前の静的JSONで回数制限の心配が無いので、
   ⟳ボタンを押すたび(クールダウン中でも)無条件で再取得しなおす。 */
/* 第30弾: 静的JSONのキャッシュを全部捨てる。
   第15弾では3ファイル(calendar/matches/matchEvents)だけを対象にしたが、
   順位表・優勝確率・スタッツ・クラブ情報・ニュース・天皇杯は ensure* の
   「一度読んだら二度と読まない」ガードに阻まれ、⟳を押しても変わらないままだった
   (アプリを完全に閉じて開き直すまで反映されない)。
   自前の静的JSONは回数制限が無いので、⟳のたびに全部読み直してよい。

   state.masters は触らない(ビルドし直さないと変わらない)。
   state.ondemand も触らない(ondemandActiveCacheForLeague が generatedAtJst の比較で自動的に捨てる)。 */
/* 第37弾: 可視復帰のたびに捨てると通信量が跳ねるファイル。
   club_extra.json(1.34MB)と news.json(3.0MB)は試合結果と無関係で、バッチの更新頻度も低い。
   ⟳ボタンを押したときだけ捨てる(deep=true)。 */
function clearStaticCaches(deep) {
  /* 第38弾: state.cache を差し替えると、取得中の ensure* が捨てられたオブジェクトへ
     書き込んでしまう。参照は保ったままキーを消す。 */
  for (const lg of Object.keys(state.cache)) {
    for (const k of Object.keys(state.cache[lg])) delete state.cache[lg][k];
  }   // leagueCache()経由のmatches/standings/simulation/stats/impact/history/rankHistory/matchEvents
  state.calendar = undefined;
  state.clubExtra = undefined;
  state.news = undefined;
  state.emperorsCup = undefined;
  state.emperorsCupEvents = undefined;
  state.leagueCup = undefined;
  state.leagueCupEvents = undefined;
  /* 第37弾: カレンダーの基準日もここで戻す。戻す場所が無かったため、土曜の夜に開いた
     PWAを日曜の昼に開き直すと「今日」へのスクロールが土曜のブロックへ飛んでいた。 */
  state.calAnchorDate = null;
  calGroupCache = null;
  // 第26弾: ニュースの置き場が増えたので、ここも一緒に戻す(古い記事が残らないように)
  state.newsCache = null;
  state.newsAll = undefined;
  state.newsOb = undefined;
  state.newsWhole = undefined;
  myNewsEntriesCache = null;
  if (deep) {
    state.clubExtra = undefined;
    state.news = undefined;
    myNewsEntriesCache = null;
  }
}

/* 第30弾: 可視復帰での再取得(maybeRefreshStaticOnVisible)を間引くための下限。
   タブを行き来するだけで毎回読み直すと、club_extra.json(1.3MB)やnews.json(3.0MB)まで
   取りに行くことになり通信量が跳ねる。バッチ(4時間おき)とlive_watch(5分おき)のうち
   短い方に合わせて5分にしてある。 */
const STATIC_REFRESH_MIN_INTERVAL_MS = 5 * 60 * 1000;
let lastStaticRefreshAt = 0;

async function refreshStaticMatchData(deep) {
  lastStaticRefreshAt = Date.now();
  clearStaticCaches(deep);
  // いま開いているタブに要るぶんは renderActiveTab() -> ensureTabData() が自分で取り直す。
  // ここで先読みするのは、どのタブに居ても日程の得点速報が最新になるようにするため。
  await Promise.all([
    ensureCalendar(),
    ...Object.keys(LEAGUES).map(lg => ensureMatchEvents(lg)),
    ...Object.keys(LEAGUES).map(lg => ensureMatches(lg)),
  ]);
  await renderActiveTab();
}

/* 第30弾: バックグラウンドから戻ってきたときの再取得。
   ホーム画面に追加したPWAは実質「閉じない」ので、これが無いと⟳を押さないかぎり
   初回ロード時のデータのまま何日も表示され続ける。 */
function maybeRefreshStaticOnVisible() {
  if (Date.now() - lastStaticRefreshAt < STATIC_REFRESH_MIN_INTERVAL_MS) return;
  // 失敗しても投げない。ここで例外を出すとライブポーリングの再開まで巻き込む。
  // 復帰時は浅い更新(clubExtra/newsは据え置き)。全部取り直したいときは⟳を押してもらう。
  refreshStaticMatchData(false).catch(() => {});
}
async function runOndemandUpdate(opts) {
  const ignoreCooldown = !!(opts && opts.ignoreCooldown);
  await refreshStaticMatchData();
  if (state.ondemandRunning || (!ignoreCooldown && ondemandRemainingSec() > 0)) return;
  state.ondemandRunning = true;
  state.ondemandProgress = null;
  updateOndemandHeaderBtn();

  try {
    for (const lg of Object.keys(LEAGUES)) await ensureMatches(lg);

    const now = Date.now();
    const plan = [];
    for (const lg of Object.keys(LEAGUES)) {
      const all = (leagueCache(lg).matches && leagueCache(lg).matches.matches) || [];
      for (const round of pickTargetRounds(all, now)) plan.push({ league: lg, round });
    }

    if (!plan.length) {
      showOndemandToast("いま更新対象の試合がありません");
      return;
    }

    const attemptedLeagues = new Set(plan.map(p => p.league));
    const succeededLeagues = new Set();
    const perLeagueIncoming = {};
    for (let i = 0; i < plan.length; i++) {
      const { league, round } = plan[i];
      state.ondemandProgress = (i + 1) + "/" + plan.length;
      updateOndemandHeaderBtn();
      showOndemandToast("J1〜J3 を取得中… " + state.ondemandProgress, false);
      if (i > 0) await sleep(ONDEMAND_REQUEST_GAP_MS);

      const master = state.masters[league];
      const url = "https://www.thesportsdb.com/api/v1/json/" + ONDEMAND_API_KEY + "/eventsround.php?id=" +
        encodeURIComponent(master.meta.idLeague) + "&r=" + round + "&s=" + encodeURIComponent(master.meta.season);
      const json = await getJsonOptional(url);
      const parsed = parseEvents(json, master, master.meta.season);
      if (parsed == null) continue; // 失敗。このぶんは捨てて既存データを維持する
      succeededLeagues.add(league);
      (perLeagueIncoming[league] = perLeagueIncoming[league] || []).push(...parsed);
    }

    // 実際に中身が変わった試合数を数える(「更新あり」/「更新なし」の判定用)。
    // 比較対象は、この回の取得直前に有効だった値(オンデマンドの前回値、無ければバッチの値)。
    let changedCount = 0;
    const fetchedAt = nowJstIso();
    for (const league of Object.keys(perLeagueIncoming)) {
      const matchesData = leagueCache(league).matches;
      const batchGen = matchesData && matchesData.meta && matchesData.meta.generatedAtJst;
      const batchById = {};
      for (const bm of (matchesData && matchesData.matches) || []) batchById[bm.idEvent] = bm;
      const prev = ondemandActiveCacheForLeague(league); // 陳腐化していれば既にnull化されている
      const prevMap = (prev && prev.matches) || {};
      const nextMap = Object.assign({}, prevMap);
      for (const m of perLeagueIncoming[league]) {
        const before = prevMap[m.idEvent] || batchById[m.idEvent];
        const isDifferent = !before || before.finished !== m.finished || before.status !== m.status ||
          (before.home && before.home.score) !== m.home.score || (before.away && before.away.score) !== m.away.score;
        if (isDifferent) changedCount++;
        nextMap[m.idEvent] = m;
      }
      const data = { fetchedAt, baseGeneratedAt: batchGen || null, matches: nextMap };
      state.ondemand[league] = data;
      saveOndemandCache(league, data);
    }

    showOndemandToast(ondemandOutcomeMessage(attemptedLeagues, succeededLeagues, changedCount));
  } catch (e) {
    showOndemandToast("更新できませんでした");
  } finally {
    state.ondemandCooldownUntil = Date.now() + ONDEMAND_MIN_INTERVAL_MS;
    state.ondemandRunning = false;
    state.ondemandProgress = null;
    ensureOndemandTicker();
    updateOndemandHeaderBtn();
    updateOndemandPopoverInPlace();
    renderActiveTab();
    // 第12弾: 取得結果でmatchesが更新されたので、ライブ候補(kickoff/finished)を再評価する。
    // 稼働中でなければ再開判定、稼働中ならここでは何もしない(次のtickで自然に反映される)。
    evaluateLiveSchedule();
  }
}

/* ---------- 第12弾: ライブスコアのポーリング制御・表示(専用タブは作らず、ホームタブと
   全体モード日程タブにインライン表示する。取得層は上のpickLiveCandidates/fetchLiveScores/
   filterLiveEventsを参照)。 ---------- */

let livePollTimer = null;

/* 3リーグぶんのmatchesを確保してから候補Mapを作る(既に読み込み済みならensureMatchesは追加取得しない)。 */
async function buildLiveCandidateMap(now) {
  for (const lg of Object.keys(LEAGUES)) await ensureMatches(lg);
  const matchesByLeague = {};
  for (const lg of Object.keys(LEAGUES)) matchesByLeague[lg] = effectiveMatches(lg);
  return pickLiveCandidates(matchesByLeague, now);
}

/* 試合終了検知(3-4章): 進行中の試合が全部終わったら第10弾のオンデマンド取得を1回だけ自動実行する。
   state.ondemandRunningを見て多重実行を防ぐ(クールダウンだけ無視する)。 */
async function triggerOndemandForFinishedLive() {
  if (state.ondemandRunning) return;
  await runOndemandUpdate({ ignoreCooldown: true });
}

/* 1周回ぶんの取得と反映。戻り値はポーリングを続けるべきか(true=継続/リトライ、false=停止)。
   候補が0件のときはlivescore.phpに一切リクエストを投げない(3-1章の最重要事項)。 */
async function liveTick() {
  if (state.liveStopped) return false;

  const candidates = await buildLiveCandidateMap(Date.now());
  if (candidates.size === 0) {
    if (Object.keys(state.liveScores).length || Object.keys(state.liveMissingStreak).length) {
      state.liveScores = {};
      state.liveMissingStreak = {};
      renderActiveTab();
    }
    state.liveAutoFetchDone = false; // 次の試合が候補に入ってきたときのためにリセットしておく
    /* 第37弾: 通算回数もここで戻す。LIVE_MAX_TOTAL_FETCHES は「1試合帯での暴走」を
       止めるための上限なので、候補が0件になった=試合が途切れた時点で役目は終わっている。
       戻す場所が無かったため、土曜に昼と夜の試合を追うだけで通算200回に達し、
       以後アプリを完全に開き直すまでライブスコアが二度と出なくなっていた
       (PWAは実質閉じないので数日単位で効いてしまう)。 */
    state.liveTotalFetches = 0;
    state.liveStopped = false;
    return false;
  }

  if (state.liveTotalFetches >= LIVE_MAX_TOTAL_FETCHES) {
    state.liveStopped = true;
    return false;
  }
  state.liveTotalFetches++;

  const events = await fetchLiveScores();
  if (events == null) {
    state.liveConsecFails++;
    if (state.liveConsecFails >= LIVE_MAX_CONSEC_FAILS) {
      showOndemandToast("ライブスコアを取得できませんでした");
      return false; // 次に可視化されたときに再開してよい(evaluateLiveScheduleが再評価する)
    }
    return true; // まだリトライする(直前に取得できた値は残したまま)
  }
  state.liveConsecFails = 0;

  const filtered = filterLiveEvents(events, candidates, LIVE_LEAGUE_IDS);
  const byId = new Map(filtered.map(e => [e.idEvent, e]));
  const nextScores = {}, nextMissing = {};
  let stillOngoing = false;

  for (const [idEvent] of candidates) {
    const hit = byId.get(idEvent);
    if (hit) {
      nextScores[idEvent] = hit;
      nextMissing[idEvent] = 0;
      if (hit.status !== "FT") stillOngoing = true;
    } else {
      const streak = (state.liveMissingStreak[idEvent] || 0) + 1;
      nextMissing[idEvent] = streak;
      if (streak < LIVE_MISSING_STREAK_LIMIT) {
        stillOngoing = true; // まだ終了と確定していない(単発の欠落かもしれない)。直前の値を維持する
        if (state.liveScores[idEvent]) nextScores[idEvent] = state.liveScores[idEvent];
      }
      // streak が上限に達したら終了とみなし、nextScoresには入れない(=表示から消える)
    }
  }

  state.liveScores = nextScores;
  state.liveMissingStreak = nextMissing;
  state.liveUpdatedAt = nowJstIso(); // 端末時刻。livescore.phpのupdatedフィールドは使わない(1章の落とし穴)
  renderActiveTab();

  // 第31弾: 得点者データの取り直しと、必要なら取得の依頼。
  // awaitしない(ポーリングの周期をこの通信で遅らせない)。
  tickMatchEvents(candidates);

  if (!stillOngoing && !state.liveAutoFetchDone) {
    state.liveAutoFetchDone = true;
    triggerOndemandForFinishedLive(); // awaitしない。取得完了を待たずポーリング自体は続けてよい
  }
  return true;
}

function startLivePolling() {
  if (livePollTimer) return;
  livePollTimer = setInterval(async () => {
    const keepGoing = await liveTick();
    if (!keepGoing) stopLivePolling();
  }, LIVE_POLL_INTERVAL_MS);
}
function stopLivePolling() {
  if (livePollTimer) { clearInterval(livePollTimer); livePollTimer = null; }
}
/* 「今、ポーリングすべきか」を再評価する入口。アプリ起動時・可視化復帰時・オンデマンド取得後に呼ぶ。
   既に稼働中(livePollTimer有り)なら何もしない(setInterval自身が毎回候補を再評価して自然に止まる)。 */
async function evaluateLiveSchedule() {
  if (state.liveStopped || livePollTimer) return;
  const keepGoing = await liveTick(); // 可視化復帰時は「即1回取得してから再開する」を兼ねる
  if (keepGoing) startLivePolling();
}

/* ---------- 表示 ---------- */

/* strProgressは"45+4"のような文字列。分数に変換しようとせずそのまま出す(4-2章)。
   未知のstrStatus(ET/PEN/AET/POSTPなど)が来ても例外を投げず、そのまま表示する。 */
function liveStatusLabel(status, progress) {
  if (status === "1H" || status === "2H") return (progress != null ? progress : "") + "′";
  if (status === "HT") return "ハーフタイム";
  if (status === "FT") return "終了";
  return status || "";
}
function findLiveMatchForTeam(idTeam) {
  for (const idEvent of Object.keys(state.liveScores)) {
    const m = state.liveScores[idEvent];
    if (m.home.idTeam === idTeam || m.away.idTeam === idTeam) return m;
  }
  return null;
}
/* 第13弾: TheSportsDB側のlivescore.phpにまだ載っていない(=findLiveMatchForTeamが空を返す)間の
   フォールバック。キックオフ済み(kickoffJst<=now)かつ未消化(finished=false)の自クラブの試合で、
   match_events.jsonにエントリがあれば(=jleague.jp側では試合開始を確認済み)、得点イベントから
   暫定スコアを組み立てて「試合中」カードの代わりに使う(calMatchRowHtml/scheduleRowHtmlの
   derivedScoreFromEventsと同じ考え方)。 */
function findDerivedLiveMatchForTeam(mine, league) {
  if (!league) return null;
  const now = Date.now();
  for (const m of mine) {
    if (m.finished || m.kickoffTbd || !m.kickoffJst) continue;
    if (new Date(m.kickoffJst).getTime() > now) continue; // まだキックオフ前
    const ev = findMatchEvents(league, m.idEvent);
    if (!ev) continue;
    const derived = derivedScoreFromEvents(ev, m.home.idTeam, m.away.idTeam);
    if (!derived) continue;
    return { match: m, derived };
  }
  return null;
}
/* renderLiveCardの推定版。TheSportsDB由来の status/progress/更新時刻が無いので、
   その代わりに「試合速報の得点数から推定」であることを明示するラベルにする。 */
function renderDerivedLiveCard(m, derived, team) {
  return '<section><h2><span class="live-dot"></span> 試合中(推定)</h2><div class="card live-card">' +
    '<div class="live-score-row">' +
      '<span class="live-team' + (m.home.idTeam === team.idTeam ? " me" : "") + '">' + teamSwatchHtml(m.home.idTeam) + esc(m.home.short || m.home.ja) + '</span>' +
      '<span>' + derived.home + ' - ' + derived.away + '</span>' +
      '<span class="live-team' + (m.away.idTeam === team.idTeam ? " me" : "") + '">' + teamSwatchHtml(m.away.idTeam) + esc(m.away.short || m.away.ja) + '</span>' +
    '</div>' +
    '<div class="live-updated">試合速報の得点数から推定(公式データはまだ未反映)</div>' +
  '</div></section>';
}
/* ホームタブ最上部の「試合中」カード。自クラブが試合中のときだけ呼ばれ、「次の試合」カードの代わりに出す
   (同じ試合が2箇所に出るのを避けるため、呼び出し側でrenderNextと排他にする)。 */
function renderLiveCard(m, team) {
  const label = liveStatusLabel(m.status, m.progress);
  const updated = state.liveUpdatedAt ? fmtHm(state.liveUpdatedAt) : "--:--";
  const homeScore = m.home.score != null ? m.home.score : "-";
  const awayScore = m.away.score != null ? m.away.score : "-";
  return '<section><h2><span class="live-dot"></span> 試合中　' + esc(label) + '</h2><div class="card live-card">' +
    '<div class="live-score-row">' +
      '<span class="live-team' + (m.home.idTeam === team.idTeam ? " me" : "") + '">' + teamSwatchHtml(m.home.idTeam) + esc(m.home.short) + '</span>' +
      '<span>' + homeScore + ' - ' + awayScore + '</span>' +
      '<span class="live-team' + (m.away.idTeam === team.idTeam ? " me" : "") + '">' + teamSwatchHtml(m.away.idTeam) + esc(m.away.short) + '</span>' +
    '</div>' +
    '<div class="live-updated">' + esc(updated) + ' 更新</div>' +
  '</div></section>';
}

/* ---------- スタッツ(stats.py: 自前計算 + 公式サイト由来の指標をまとめたもの) ---------- */

function fmtStatValue(value, format) {
  if (value == null) return "－";
  if (format === "signedInt") return (value > 0 ? "+" : "") + value;
  if (format === "float2") return Number(value).toFixed(2);
  if (format === "signed2") {
    const v = Number(value);
    return (v > 0 ? "+" : "") + v.toFixed(2);
  }
  if (format === "percent1") return Number(value).toFixed(1) + "%";
  return String(value); // "int" / "raw"(公式値そのまま)
}
function fmtStatRank(rank, clubCount) {
  if (rank == null) return "";
  return rank + "位" + (clubCount ? "/" + clubCount : "");
}

/* ---------- レーダーチャート(インラインSVG。選択クラブ1つぶんのみ、グループごとに1枚) ----------
   stats.json の metrics[].group に沿ってグループ分けする。既定表示は「モデル」。
   基礎グループは 勝点/勝利数/得点/失点/得失点差 が互いに強く相関するため、
   隣接軸が似た情報にならないよう、勝点と得失点差を隣り合わせない順番にしてある。 */

const RADAR_GROUPS = [
  { id: "basic", tabLabel: "基礎", keys: ["points", "win", "gd", "ga", "gf"] },
  { id: "average", tabLabel: "平均", keys: ["pointsPerGame", "gaPerGame", "homePoints", "awayPoints", "form5Points"] },
  { id: "model", tabLabel: "モデル", keys: ["attackRating", "defenseRating", "xPoints", "pointsOverX", "remainingDifficulty"] },
  { id: "official", tabLabel: "公式スタッツ", keys: ["scorePg", "passCountPg", "ballRate", "distance", "sprint", "cleanSheet"] },
  /* 第40弾: レーダーではなくRPGのステータス画面を描く。keysを持たないので、
     renderStatsTab() 側で描き分ける。 */
  { id: "rpg", tabLabel: "つよさ", keys: null },
];
// J2/J3にはdistance/sprintが無い(公式サイトの提供指標がリーグによって違うため)。
// データが無くても軸のラベルだけは出す必要があるので、その場合だけのフォールバック表示名。
const RADAR_LABEL_FALLBACK = { distance: "走行距離", sprint: "スプリント" };

function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180; // 0度=真上
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

function renderStatsGroupTable(stats, team, groupDef) {
  const t = (stats.teams || []).find(x => x.idTeam === team.idTeam);
  if (!t) return "";
  const clubCount = stats.meta && stats.meta.clubCount;
  const metricByKey = {};
  for (const m of stats.metrics || []) metricByKey[m.key] = m;

  const rows = groupDef.keys.map(key => {
    const m = metricByKey[key];
    if (!m) return ""; // このリーグには無い指標(J2/J3のdistance等)。レーダー側は「データなし」軸として出す
    const val = t.values ? t.values[key] : undefined;
    const rank = t.ranks ? t.ranks[key] : undefined;
    const isTop3 = rank != null && rank <= 3;
    return '<tr>' +
      '<td class="p-name">' + esc(m.label) + '</td>' +
      '<td>' + esc(fmtStatValue(val, m.format)) + '</td>' +
      '<td class="' + (isTop3 ? "stat-rank-top" : "") + '">' + esc(fmtStatRank(rank, clubCount)) + '</td>' +
    '</tr>';
  }).join("");

  return '<div class="stat-group"><table><tbody>' + rows + '</tbody></table></div>';
}

function renderRadarForGroup(stats, team, groupDef) {
  const t = (stats.teams || []).find(x => x.idTeam === team.idTeam);
  if (!t) return "";
  const clubCount = stats.meta && stats.meta.clubCount;
  const metricByKey = {};
  for (const m of stats.metrics || []) metricByKey[m.key] = m;

  const axisDefs = groupDef.keys.map(key => ({
    key,
    m: metricByKey[key],
    label: metricByKey[key] ? metricByKey[key].label : (RADAR_LABEL_FALLBACK[key] || key),
  }));
  if (axisDefs.length < 3) return ""; // 軸が3本未満は図が成立しないので出さない(呼び出し側は表のみ表示)

  const n = axisDefs.length;
  const cx = 150, cy = 150, R = 100;
  const angleStep = 360 / n;

  const color = team.color || "#0b6b3a";
  /* 第38弾: 固定しきい値(luminance>0.5)は中間輝度のクラブ色で誤判定するため、
     コントラスト比で選ぶ pickInk に置き換えた(第29弾で他は全部そうした)。 */
  const light = pickInk(color) === INK_ON_LIGHT;
  // クラブカラーが明るいと2pxの線・マーカーが白背景に埋もれるため、暗い派生色を使う
  const strokeColor = light ? darken(color, 0.55) : color;
  const fillColor = toRgba(color, 0.18);

  const rings = [0.25, 0.5, 0.75, 1.0].map(frac => {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const [x, y] = polarPoint(cx, cy, R * frac, i * angleStep);
      pts.push(x.toFixed(1) + "," + y.toFixed(1));
    }
    const stroke = frac === 0.5 ? "#c7ccd3" : "#e3e6ea"; // 0.5(リーグ中位)だけ少し濃く
    return '<polygon points="' + pts.join(" ") + '" fill="none" stroke="' + stroke + '" stroke-width="1"/>';
  }).join("");

  const spokes = [];
  for (let i = 0; i < n; i++) {
    const [x, y] = polarPoint(cx, cy, R, i * angleStep);
    spokes.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#e3e6ea" stroke-width="1"/>');
  }

  const axisData = axisDefs.map((a, i) => {
    const rank = (a.m && t.ranks) ? t.ranks[a.key] : null;
    const value = (a.m && t.values) ? t.values[a.key] : null;
    const available = !!a.m && rank != null && !!clubCount;
    const norm = available ? (clubCount - rank) / (clubCount - 1) : 0;
    return { ...a, rank, value, available, norm, angle: i * angleStep };
  });

  const dataPts = axisData.map(d => polarPoint(cx, cy, R * d.norm, d.angle));
  const dataPolygon = dataPts.map(([x, y]) => x.toFixed(1) + "," + y.toFixed(1)).join(" ");

  const markers = axisData.map((d, i) => {
    const [x, y] = dataPts[i];
    const tip = d.available
      ? d.label + ": " + fmtStatValue(d.value, d.m.format) + " (" + d.rank + "位/" + clubCount + ")"
      : d.label + ": データなし";
    return (
      '<circle class="radar-hit" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="14" fill="transparent" data-tooltip="' + esc(tip) + '"></circle>' +
      '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4.5" fill="' + strokeColor + '" stroke="#fff" stroke-width="1.5"></circle>'
    );
  }).join("");

  const labels = axisData.map(d => {
    const [x, y] = polarPoint(cx, cy, R + 20, d.angle);
    let anchor = "middle";
    if (d.angle > 5 && d.angle < 175) anchor = "start";
    else if (d.angle > 185 && d.angle < 355) anchor = "end";
    const rankText = d.available ? (d.rank + "位/" + clubCount) : "データなし";
    return (
      '<text x="' + x.toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" text-anchor="' + anchor + '" class="radar-label-name">' + esc(d.label) + '</text>' +
      '<text x="' + x.toFixed(1) + '" y="' + (y + 9).toFixed(1) + '" text-anchor="' + anchor + '" class="radar-label-rank">' + esc(rankText) + '</text>'
    );
  }).join("");

  const svg =
    '<svg viewBox="0 0 300 300" width="300" height="300" xmlns="http://www.w3.org/2000/svg">' +
      rings + spokes.join("") +
      '<polygon points="' + dataPolygon + '" fill="' + fillColor + '" stroke="' + strokeColor + '" stroke-width="2"></polygon>' +
      markers + labels +
    '</svg>';

  const limitNote =
    '<p class="radar-limit-note">各軸はリーグ内順位を外周(1位)〜中心(最下位)に置き換えたものです。面積の大小に意味はありません。' +
    '軸の並び順によって形が変わるため、クラブ間の比較は形ではなく各軸の順位で行ってください。</p>';

  /* 第38弾: レーダーは軸名と「3位/20」を <text> で出すだけなので、読み上げると文脈のない
     断片が延々と流れる。同じ内容は直後の表(renderStatsGroupTable)が正しく提供しているので、
     図の方は支援技術から隠す。 */
  return '<div class="radar-wrap" aria-hidden="true">' + svg + '</div><div id="radarTooltip" role="status" aria-live="polite"></div>' + limitNote;
}

/* 第41弾: ドット絵のキャラクター。

   スーパーファミコン期のRPGのフィールドキャラの様式(2頭身、正面向き、太い輪郭)を
   借りている。特定の作品のキャラを写したものではない。

   左半分(11列)だけ持って、中心列(x=10)を軸に鏡像にして21列にする。こうすると
   左右対称が壊れようがない(手で全幅を書くと必ずどこかで1列ずれる)。
   称号ごとの装備は上に重ねるレイヤーで、こちらは左右非対称なので全幅で書く。

   色は c(クラブの1stカラー)と d(2ndカラーを少し暗くしたもの)だけを差し替える。
   肌・髪・輪郭・金属は固定にしてあり、どのクラブでも人物として読めるようにしている。 */
const SPRITE_W = 21;
const SPRITE_HALF = [
  "...........", "........ooo", "......oohhh", ".....ohhhhh", "....ohhhhhh",
  "....ohhssss", "....ohsssss", "....ohseess", "....ohsssss", ".....osssss",
  "......oSSSS", ".....occccc", "....occcccc", "...oscccccc", "...oscccccc",
  "....occcccc", "....odddddd", "....odddddd", ".....odddo.", ".....oddo..",
  "....ooooo..", "...........",
];
/* 装備。キーは行番号(疎)。'.' は「下のドットをそのまま残す」。 */
const SPRITE_GEAR = {
  sword: { 7: ".................om", 8: ".................omM", 9: ".................omM",
           10: ".................omM", 11: ".................omM", 12: "................ommmo",
           13: ".................oyo", 14: ".................oyo", 15: ".................ooo" },
  shield: { 11: "..ooo", 12: ".omMmo", 13: ".omMmo", 14: ".omMmo", 15: ".omMmo", 16: "..ooo" },
  /* ツバは額の高さ(6行目)まで。7行目は目の行なので、そこまで下ろすと顔が隠れる。 */
  hat: { 0: ".........ooo", 1: "........occco", 2: "........occco", 3: ".......occccco",
         4: "......occccccco", 5: ".....occccccccco",
         6: "...ooooooooooooooo" },
  staff: { 6: ".................owo", 7: "................owwwo", 8: ".................owo",
           9: ".................oMo", 10: ".................oMo", 11: ".................oMo",
           12: ".................oMo", 13: ".................oMo", 14: ".................oMo",
           15: ".................oMo" },
  band: { 5: "....ooooooooooooo", 6: "....occccccccccco" },
};
/* 称号ごとの装備。称号は build_rpg.py が上位2パラメータから決める。 */
const TITLE_GEAR = {
  "ゆうしゃ": ["sword", "shield"],
  "まけんし": ["hat", "sword"],
  "せんし": ["sword"],
  "はやてのつるぎ": ["band", "sword"],
  "けんじゃ": ["shield", "staff"],
  "せいきし": ["shield"],
  "まもりびと": ["band", "shield"],
  "まどうし": ["hat"],
  "まほうつかい": ["hat", "staff"],
  "ぶとうか": ["band"],
};

function spriteRows(title) {
  const rows = SPRITE_HALF.map(r => {
    const p = (r + "...........").slice(0, 11);
    return p + p.slice(0, 10).split("").reverse().join("");
  });
  for (const gear of (TITLE_GEAR[title] || [])) {
    const layer = SPRITE_GEAR[gear];
    if (!layer) continue;
    for (const key of Object.keys(layer)) {
      const y = Number(key), src = layer[key];
      if (!(y >= 0 && y < rows.length)) continue;
      const cur = rows[y].split("");
      for (let x = 0; x < src.length && x < SPRITE_W; x++) {
        if (src[x] !== ".") cur[x] = src[x];
      }
      rows[y] = cur.join("");
    }
  }
  return rows;
}

/* 横に続く同じ色を1つの <rect> にまとめる(1ドット1要素だと462個になる)。 */
function spriteSvgHtml(title, color, colorSub, px) {
  const rows = spriteRows(title);
  const pal = {
    o: "#2a2a35", h: "#4a3728", s: "#f4c9a0", S: "#d9a678", e: "#1a1a22",
    m: "#ced2da", M: "#8c929e", w: "#f2f2f5", y: "#e2b640",
    c: color || NEUTRAL_COLOR,
    d: mixHex(colorSub || color || NEUTRAL_COLOR, "#000000", 0.28),
  };
  let body = "";
  for (let y = 0; y < rows.length; y++) {
    const row = rows[y];
    let x = 0;
    while (x < SPRITE_W) {
      const ch = row[x] || ".";
      if (!pal[ch]) { x++; continue; }
      let n = 1;
      while (x + n < SPRITE_W && (row[x + n] || ".") === ch) n++;
      body += '<rect x="' + x + '" y="' + y + '" width="' + n + '" height="1" fill="' + pal[ch] + '"/>';
      x += n;
    }
  }
  return '<svg viewBox="0 0 ' + SPRITE_W + ' ' + rows.length + '"' +
    ' width="' + (SPRITE_W * px) + '" height="' + (rows.length * px) + '"' +
    ' shape-rendering="crispEdges" aria-hidden="true" focusable="false">' + body + '</svg>';
}

/* 第40弾: 昔のRPGのステータス画面。

   Lv = 現在の勝点
   HP = 直近5試合の勝点を100点満点に写したもの(5連敗なら1で瀕死)
   MP = 残りの力。最大は残り試合×3(全部勝ったときの勝点)、現在値はモデルが
        「このあと取る」と見ている勝点。シーズンが進むほど最大MPが減っていく。
   6つのパラメータはリーグ内で標準化した相対値(平均128)。
   リーグごとに公式スタッツの提供指標が違うので、リーグをまたいだ比較はできない。 */
function rpgGaugeHtml(key, now, max, cls, extraHtml) {
  const pct = max > 0 ? Math.max(0, Math.min(100, Math.round(now / max * 100))) : 0;
  return '<div class="rpg-row">' +
    '<span class="rpg-key">' + esc(key) + '</span>' +
    '<span class="rpg-num">' + now + '<span class="muted"> / ' + max + '</span></span>' +
    '<span class="rpg-track"><span class="rpg-fill ' + cls + '" style="width:' + pct + '%"></span></span>' +
    (extraHtml || '<span class="rpg-rank"></span>') +
  '</div>';
}

function renderRpgStatus(rpg, team, stats) {
  if (!rpg || !rpg.teams) {
    return '<p class="muted" style="margin:0">ステータスのデータがまだありません。' +
      '(次回のバッチで作られます)</p>';
  }
  const t = rpg.teams.find(x => x.idTeam === team.idTeam);
  if (!t) return '<p class="muted" style="margin:0">このクラブのステータスが見つかりません。</p>';

  const clubCount = (rpg.meta && rpg.meta.clubCount) || rpg.teams.length;
  const hp = t.hp || {}, mp = t.mp || {};
  /* 色は状態名と揃える: ひんし=赤 / ておい=黄 / それ以上=緑 */
  const hpCls = hp.now < 25 ? "hp danger" : (hp.now < 50 ? "hp warn" : "hp");
  const stateCls = hp.now < 25 ? "rpg-state danger" : "rpg-state";
  const recentHtml = (hp.recent || []).length
    ? '<span class="rpg-recent">' + hp.recent.map(x => '<span class="pill ' + x + '">' + x + '</span>').join("") + '</span>'
    : "";

  const paramRows = (rpg.params || []).map(p => {
    const v = (t.params || {})[p.key];
    if (!v) return "";
    const pct = Math.max(2, Math.min(100, Math.round(v.value / 255 * 100)));
    return '<div class="rpg-row">' +
      '<span class="rpg-key">' + esc(p.label) + '</span>' +
      '<span class="rpg-num">' + v.value + '</span>' +
      '<span class="rpg-track tick"><span class="rpg-fill" style="width:' + pct + '%"></span></span>' +
      '<span class="rpg-rank">' + v.rank + 'い/' + clubCount + '</span>' +
    '</div>';
  }).join("");

  /* MPの意味は「いまどこにいて、どこへ行くと見られているか」なので、
     現在順位と予想順位はゲージのすぐ下に独立して出す(説明文に埋めると読まれない)。 */
  const rankLine = (mp.currentRank && mp.expectedRank != null)
    ? '<p class="rpg-rankline">いま <b>' + mp.currentRank + 'い</b>' +
      ' <span class="muted">→</span> よそう <b>' + Math.round(mp.expectedRank) + 'い</b></p>'
    : "";
  const srcLine = (rpg.meta && rpg.meta.powerSource === "physique")
    ? 'ちからは平均身長と体重、すばやさはスプリント回数から。'
    : 'ちからは空中戦勝利と体格、すばやさはインターセプトから。';

  /* 枠の中はひらがなと数字だけにしてある(クラブ名と HP/MP/Lv を除く)。
     説明は枠の外に出す。中に混ぜると、せっかくの見た目が説明文で埋まる。 */
  return '<div class="rpg">' +
    '<div class="rpg-top">' +
      '<span class="rpg-sprite-wrap">' +
        spriteSvgHtml(t.title, team.color, team.colorSub, 4) +
      '</span>' +
      '<span class="rpg-id">' +
        '<span class="rpg-head">' +
          '<span class="rpg-name">' + esc(t.kana || team.short || team.ja) + '</span>' +
          '<span class="rpg-lv">Lv<b>' + t.level + '</b></span>' +
        '</span>' +
        '<span class="rpg-title">' + esc(t.title) + '</span>' +
        rankLine +
        recentHtml +
      '</span>' +
    '</div>' +
    '<div class="rpg-gauges">' +
      rpgGaugeHtml("HP", hp.now, hp.max, hpCls,
        '<span class="' + stateCls + '">' + esc(hp.state || "") + '</span>') +
      rpgGaugeHtml("MP", mp.now, mp.max, "mp", '<span class="rpg-rank"></span>') +
    '</div>' +
    '<hr class="rpg-sep">' +
    '<div class="rpg-gauges">' + paramRows + '</div>' +
  '</div>' +
  '<p class="rpg-foot">' +
    '<b>Lv</b> 勝点 / <b>HP</b> 直近5試合の成績 / <b>MP</b> このあと取れると見込まれる勝点' +
    '(上限は残り試合を全勝したときの勝点なので、シーズンが進むほど減ります)' +
    '<br>各パラメータはリーグ内での相対値(平均128、1〜255)。バーの中央の線がリーグ平均です。' +
    srcLine + 'リーグをまたいだ比較はできません。' +
  '</p>';
}

function renderStatsTab(stats, team) {
  if (!stats) {
    return '<section><h2>スタッツ</h2><div class="card"><p class="muted" style="margin:0">スタッツデータがまだありません。</p></div></section>';
  }
  const t = (stats.teams || []).find(x => x.idTeam === team.idTeam);
  if (!t) {
    return '<section><h2>スタッツ</h2><div class="card"><p class="muted" style="margin:0">このクラブのスタッツが見つかりません。</p></div></section>';
  }

  if (!RADAR_GROUPS.some(g => g.id === state.statsGroup)) state.statsGroup = "model";
  const activeGroup = RADAR_GROUPS.find(g => g.id === state.statsGroup);

  const subtabHtml = '<div class="stats-subtabs">' + RADAR_GROUPS.map(g =>
    '<button type="button" class="' + (g.id === activeGroup.id ? "active" : "") + '" data-statsgroup="' + g.id + '">' + esc(g.tabLabel) + '</button>'
  ).join("") + '</div>';

  /* 第40弾: ステータスだけはレーダーではなくRPG風の画面を描く */
  if (activeGroup.id === "rpg") {
    return '<section><h2>スタッツ</h2><div class="card">' + subtabHtml +
      renderRpgStatus(leagueCache(state.league).rpg, team, stats) + '</div></section>';
  }

  const radarHtml = renderRadarForGroup(stats, team, activeGroup);
  const tableHtml = renderStatsGroupTable(stats, team, activeGroup);
  const noteHtml = (stats.meta && stats.meta.note) ? '<p class="promo-note">' + esc(stats.meta.note) + '</p>' : "";

  return '<section><h2>スタッツ</h2><div class="card">' + subtabHtml + radarHtml + tableHtml + noteHtml + '</div></section>';
}

/* ---------- 確率推移グラフ(第8弾A。スタッツタブ、インラインSVG・外部ライブラリ不使用) ----------
   dates配列と同じ長さの各クラブの確率配列(data/history/{league}_probability_history.json)を折れ線で描く。
   「あの敗戦で確率が落ちた」が読めることが目的なので、自クラブの試合結果(○/△/●)を必ず重ねる。 */

/* 試合日(kickoffDate)以降で最初のスナップショット日のインデックスを返す(完全一致しなくてもよい)。 */
function findSnapshotIndexOnOrAfter(dates, targetDate) {
  if (!targetDate || !dates || !dates.length) return null;
  for (let i = 0; i < dates.length; i++) {
    if (dates[i] >= targetDate) return i;
  }
  return dates.length - 1;
}

function buildProbabilityChartSvg(history, seriesKey, selectedClubIds, masterTeamsById, ownIdTeam, ownFinishedMatches) {
  const dates = history.dates || [];
  if (!dates.length) return "";
  const n = dates.length;
  const W = Math.max(320, n * 16);
  const H = 200;
  const padL = 28, padR = 10, padT = 10, padB = 22;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xAt = i => padL + (n === 1 ? plotW / 2 : (plotW * i) / (n - 1));
  const yAt = p => padT + plotH * (1 - p);

  const gridHtml = [0, 0.25, 0.5, 0.75, 1.0].map(f => {
    const y = yAt(f).toFixed(1);
    return '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#e3e6ea" stroke-width="1"/>' +
      '<text x="' + (padL - 5) + '" y="' + (Number(y) + 3) + '" text-anchor="end" class="chart-axis-label">' + Math.round(f * 100) + '</text>';
  }).join("");

  const labelStep = Math.max(1, Math.ceil(n / 6));
  const xLabelsHtml = dates.map((d, i) => {
    if (i % labelStep !== 0 && i !== n - 1) return "";
    const md = /^\d{4}-(\d{2})-(\d{2})/.exec(d);
    const label = md ? (+md[1]) + "/" + (+md[2]) : d;
    return '<text x="' + xAt(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" class="chart-axis-label">' + esc(label) + '</text>';
  }).join("");

  const basedOn = history.basedOnMatches || [];
  const linesHtml = selectedClubIds.map(tid => {
    const teamHist = (history.teams || {})[tid];
    if (!teamHist) return "";
    const arr = teamHist[seriesKey] || [];
    const teamInfo = masterTeamsById[tid];
    const color = (teamInfo && teamInfo.color) || "#0b6b3a";
    const pts = [];
    for (let i = 0; i < n; i++) {
      if (arr[i] == null) continue;
      pts.push([i, arr[i]]);
    }
    if (!pts.length) return "";
    const pathD = pts.map(([i, v], idx) => (idx === 0 ? "M" : "L") + xAt(i).toFixed(1) + "," + yAt(v).toFixed(1)).join(" ");
    // 前日からbasedOnMatchesが変わっていない日(試合が無かった日)はマーカーを出さない。線はそのまま繋げる。
    const markerPts = pts.filter(([i]) => i === 0 || basedOn[i] !== basedOn[i - 1]);
    const markers = markerPts.map(([i, v]) =>
      '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(v).toFixed(1) + '" r="2.5" fill="' + color + '"/>'
    ).join("");
    return '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2"/>' + markers;
  }).join("");

  let resultMarkersHtml = "";
  if (selectedClubIds.includes(ownIdTeam)) {
    const ownArr = ((history.teams || {})[ownIdTeam] || {})[seriesKey] || [];
    resultMarkersHtml = (ownFinishedMatches || []).map(m => {
      const targetDate = m.kickoffDate || (m.kickoffJst || "").slice(0, 10);
      const idx = findSnapshotIndexOnOrAfter(dates, targetDate);
      if (idx == null || ownArr[idx] == null) return "";
      const isHome = m.home.idTeam === ownIdTeam;
      const meScore = isHome ? m.home.score : m.away.score;
      const oppScore = isHome ? m.away.score : m.home.score;
      const mark = meScore > oppScore ? "○" : (meScore < oppScore ? "●" : "△");
      const x = xAt(idx).toFixed(1);
      const y = (yAt(ownArr[idx]) - 10).toFixed(1);
      return '<text x="' + x + '" y="' + y + '" text-anchor="middle" class="chart-result-mark">' + mark + '</text>';
    }).join("");
  }

  return '<div class="chart-scroll"><svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">' +
    gridHtml + xLabelsHtml + linesHtml + resultMarkersHtml +
  '</svg></div>';
}

/* 第16弾: 順位表の近くに出す「第1節からの順位推移」折れ線グラフ。scripts/rank_history.pyが
   節ごとの順位を事前計算しているので、ここでは描画するだけ(ロジックの二重実装を避ける)。
   既定では自クラブを濃い色+マーカーで強調し、他クラブは薄いグレーの線にする。
   第17弾: 右端に全クラブ名を出し、タップでそのクラブの推移をハイライトに切り替えられるようにした
   (同着(最終節の順位が並ぶ)クラブが複数いる場合は、ラベルを縦に少しずらして重なりを避ける)。
   第18弾: 節数に比例して横幅を伸ばす(→横スクロール前提)のをやめ、常に画面幅ぴったりに収まる
   固定サイズのviewBoxにした(CSS側でwidth:100%にしてスケールさせる。rank-chart-wrap参照)。
   右端のクラブ名も画面内に収まるようにし、フォントサイズも2倍にした。ハイライト中の線には
   節ごとの順位を数字で添える(全節分入れると詰まりすぎるので、x軸の節ラベルと同じ間引き間隔+
   最終節は必ず表示、にしている)。 */
function buildRankHistoryChartSvg(rankHistory, masterTeams, highlightIdTeam, rules) {
  const rounds = (rankHistory && rankHistory.rounds) || [];
  const n = rounds.length;
  const numTeams = masterTeams.length;
  if (!n || numTeams < 2) return "";

  const padL = 22, padR = 78, padT = 18, padB = 20;
  const W = 360;
  // 第19弾: クラブ名(18px)どうしが隣接順位で重なっていたため、クラブ数に応じて縦に伸ばし、
  // 1順位ぶんの高さ(rowH)を常に一定以上確保する(固定H=220だとクラブ数が多いリーグで詰まっていた)。
  const rowH = 22;
  const H = padT + padB + Math.max(1, numTeams - 1) * rowH;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xAt = i => padL + (n === 1 ? plotW / 2 : (plotW * i) / (n - 1));
  const yAt = rank => padT + plotH * (rank - 1) / (numTeams - 1);
  const halfStep = plotH / (numTeams - 1) / 2;

  const zoneBandsHtml = resolveZones(rules).map(z => {
    if (!z.ranks || !z.ranks.length) return "";
    const min = Math.min(...z.ranks), max = Math.max(...z.ranks);
    const top = (yAt(min) - halfStep).toFixed(1);
    const height = (yAt(max) + halfStep - (yAt(min) - halfStep)).toFixed(1);
    return '<rect x="' + padL + '" y="' + top + '" width="' + plotW + '" height="' + height + '" fill="' + z.color + '" opacity="0.14"/>';
  }).join("");

  const gridHtml =
    '<line x1="' + padL + '" y1="' + yAt(1).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + yAt(1).toFixed(1) + '" stroke="#e3e6ea" stroke-width="1"/>' +
    '<line x1="' + padL + '" y1="' + yAt(numTeams).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + yAt(numTeams).toFixed(1) + '" stroke="#e3e6ea" stroke-width="1"/>' +
    '<text x="' + (padL - 4) + '" y="' + (yAt(1) + 3).toFixed(1) + '" text-anchor="end" class="chart-axis-label">1</text>' +
    '<text x="' + (padL - 4) + '" y="' + (yAt(numTeams) + 3).toFixed(1) + '" text-anchor="end" class="chart-axis-label">' + numTeams + '</text>';

  const labelStep = Math.max(1, Math.ceil(n / 8));
  const xLabelsHtml = rounds.map((r, i) => {
    if (i % labelStep !== 0 && i !== n - 1) return "";
    return '<text x="' + xAt(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" class="chart-axis-label">' + r + '</text>';
  }).join("");

  const ranksByTeam = rankHistory.ranks || {};
  const pathFor = tid => {
    const arr = ranksByTeam[tid] || [];
    const pts = [];
    for (let i = 0; i < n; i++) {
      if (arr[i] == null) continue;
      pts.push([i, arr[i]]);
    }
    if (!pts.length) return null;
    return pts.map(([i, v], idx) => (idx === 0 ? "M" : "L") + xAt(i).toFixed(1) + "," + yAt(v).toFixed(1)).join(" ");
  };
  const finalRankFor = tid => {
    const arr = ranksByTeam[tid] || [];
    for (let i = arr.length - 1; i >= 0; i--) {
      if (arr[i] != null) return arr[i];
    }
    return null;
  };

  const otherLinesHtml = masterTeams.filter(t => t.idTeam !== highlightIdTeam).map(t => {
    const d = pathFor(t.idTeam);
    if (!d) return "";
    return '<path d="' + d + '" fill="none" stroke="var(--sub)" stroke-width="1" opacity="0.35"/>';
  }).join("");

  let highlightLineHtml = "";
  const highlightTeam = masterTeams.find(t => t.idTeam === highlightIdTeam);
  if (highlightTeam) {
    const d = pathFor(highlightIdTeam);
    if (d) {
      const color = highlightTeam.color || "var(--accent)";
      const arr = ranksByTeam[highlightIdTeam] || [];
      const markers = arr.map((v, i) => v == null ? "" :
        '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(v).toFixed(1) + '" r="2.5" fill="' + color + '"/>'
      ).join("");
      // 節ごとの順位数値。全節ぶん出すと詰まって読めないので、x軸ラベルと同じ間引き間隔(labelStep)
      // に合わせつつ、最終節(現在の順位)は間引かれても必ず出す。マーカーの少し上に置き、
      // 1位付近で上にはみ出す時だけ下側に回す。stroke(カード背景色)で縁取りして下の線と重ならないようにする。
      const valueLabels = arr.map((v, i) => {
        if (v == null) return "";
        if (i % labelStep !== 0 && i !== n - 1) return "";
        const cy = yAt(v);
        const above = cy - halfStep < padT + 8;
        const ly = above ? cy + 12 : cy - 7;
        return '<text class="rank-value-label" x="' + xAt(i).toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" ' +
          'fill="' + color + '" stroke="var(--card)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">' + v + '</text>';
      }).join("");
      highlightLineHtml = '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.5"/>' + markers + valueLabels;
    }
  }

  // 右端のクラブ名ラベル。最終節の順位でグループ化し、同着クラブは縦に少しずらして重なりを避ける。
  const byFinalRank = new Map();
  for (const t of masterTeams) {
    const r = finalRankFor(t.idTeam);
    if (r == null) continue;
    if (!byFinalRank.has(r)) byFinalRank.set(r, []);
    byFinalRank.get(r).push(t);
  }
  const labelLineHeight = rowH;
  const labelX = W - padR + 6;
  let teamLabelsHtml = "";
  byFinalRank.forEach((teams, r) => {
    const baseY = yAt(r);
    teams.forEach((t, idx) => {
      const offset = (idx - (teams.length - 1) / 2) * labelLineHeight;
      const y = baseY + offset;
      const isHi = t.idTeam === highlightIdTeam;
      const fill = isHi ? (t.color || "var(--accent)") : "var(--sub)";
      const weight = isHi ? "700" : "400";
      teamLabelsHtml +=
        '<g class="rank-team-label" data-rankteam="' + esc(t.idTeam) + '">' +
          '<rect x="' + (labelX - 3) + '" y="' + (y - 12).toFixed(1) + '" width="' + (padR - 4) + '" height="22" fill="transparent"/>' +
          '<text x="' + labelX + '" y="' + (y + 6).toFixed(1) + '" fill="' + fill + '" font-weight="' + weight + '">' + esc(t.short || t.ja) + '</text>' +
        '</g>';
    });
  });

  return '<div class="rank-chart-wrap"><svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
    zoneBandsHtml + gridHtml + xLabelsHtml + otherLinesHtml + highlightLineHtml + teamLabelsHtml +
  '</svg></div>';
}
function renderRankHistoryChart(rankHistory, master, ownIdTeam, league) {
  if (!rankHistory || !rankHistory.rounds || !rankHistory.rounds.length) return "";
  if (state.rankHistoryLeague !== league) {
    state.rankHistoryLeague = league;
    state.rankHighlightTeam = null;
  }
  const rules = master.promotionRules;
  const highlightIdTeam = (state.rankHighlightTeam && master.teams.some(t => t.idTeam === state.rankHighlightTeam))
    ? state.rankHighlightTeam
    : ownIdTeam;
  const svgHtml = buildRankHistoryChartSvg(rankHistory, master.teams, highlightIdTeam, rules);
  if (!svgHtml) return "";
  const highlightTeam = master.teams.find(t => t.idTeam === highlightIdTeam);
  const legendHtml = highlightTeam
    ? '<div class="legend"><span><i class="sw" style="background:' + esc(highlightTeam.color || "#999") + '"></i>' + esc(highlightTeam.short || highlightTeam.ja) + '</span><span>クラブ名タップで表示を切替(他クラブは薄いグレーの線)</span></div>'
    : "";
  return '<section><h2>順位推移(第1節〜第' + rankHistory.meta.maxRound + '節)</h2><div class="card">' +
    svgHtml + legendHtml +
  '</div></section>';
}

function renderProbabilityChart(history, matches, team, master, league) {
  const rules = master.promotionRules;
  const zones = resolveZones(rules);
  if (!history || !history.dates || !history.dates.length || !zones.length) return "";

  if (state.chartLeague !== league) {
    state.chartLeague = league;
    state.chartClubs = [team.idTeam];
    state.chartSeries = null;
  }
  if (!state.chartSeries || !zones.some(z => z.key === state.chartSeries)) {
    state.chartSeries = zones[0].key;
  }
  const selected = (state.chartClubs && state.chartClubs.length) ? state.chartClubs : [team.idTeam];

  const seriesHtml = zones.length > 1
    ? '<div class="chart-series-tabs">' + zones.map(z =>
        '<button type="button" class="' + (z.key === state.chartSeries ? "active" : "") + '" data-chartseries="' + z.key + '">' + esc(z.label) + '</button>'
      ).join("") + '</div>'
    : "";

  const clubsSorted = [...master.teams].sort((a, b) => a.ja.localeCompare(b.ja, "ja"));
  const chipsHtml = '<div class="chart-chips">' + clubsSorted.map(t => {
    const on = selected.includes(t.idTeam);
    return '<button type="button" class="chart-chip' + (on ? " active" : "") + '" data-chartclub="' + esc(t.idTeam) + '">' + esc(t.short || t.ja) + '</button>';
  }).join("") + '</div>';

  const masterTeamsById = {};
  for (const t of master.teams) masterTeamsById[t.idTeam] = t;
  const ownFinished = (matches || []).filter(m => m.finished && (m.home.idTeam === team.idTeam || m.away.idTeam === team.idTeam));

  const svgHtml = buildProbabilityChartSvg(history, state.chartSeries, selected, masterTeamsById, team.idTeam, ownFinished);

  const legendHtml = '<div class="legend">' + selected.map(tid => {
    const t = masterTeamsById[tid];
    if (!t) return "";
    return '<span><i class="sw" style="background:' + esc(t.color || "#999") + '"></i>' + esc(t.short || t.ja) + '</span>';
  }).join("") + '<span>○=勝利 △=引分 ●=敗戦(自クラブ)</span></div>';

  const activeZone = zones.find(z => z.key === state.chartSeries);

  return '<section><h2>' + esc(activeZone ? activeZone.label + "確率の推移" : "確率の推移") + '</h2><div class="card">' +
    seriesHtml + chipsHtml + svgHtml + legendHtml +
    '<p class="promo-note">※ 開幕直後はモデルがリーグ平均に寄るため、確率の動きは実力変化を意味しません</p>' +
  '</div></section>';
}

/* ---------- 今季の主役(得点/アシスト/デュエル勝利数トップ。club_extra.json由来) ---------- */

function playerUrl(playerId) {
  return playerId ? "https://www.jleague.jp/player/" + encodeURIComponent(playerId) + "/" : null;
}

function renderLeaders(clubExtra, team) {
  const c = clubExtra && clubExtra.clubs && clubExtra.clubs[team.idTeam];
  if (!c || !c.leaders) return "";

  const rows = Object.keys(c.leaders).map(cat => {
    const info = c.leaders[cat];
    const top = (info.players || [])[0];
    if (!top) return "";
    const url = playerUrl(top.playerId);
    const nameHtml = url
      ? '<a href="' + url + '" target="_blank" rel="noopener">' + esc(top.name || "－") + '</a>'
      : esc(top.name || "－");
    return '<div class="leader-row"><span class="leader-cat">' + esc(info.label || "") + '</span>' +
      '<span class="leader-name">' + nameHtml + '</span>' +
      '<span class="leader-val">' + esc(String(top.statsValue == null ? "－" : top.statsValue)) + '</span></div>';
  }).join("");
  if (!rows) return "";

  return '<section><h2>今季の主役</h2><div class="card"><div class="leaders">' + rows + '</div></div></section>';
}

/* ---------- 選手一覧(club_extra.json由来。無ければ公式リンク1本にフォールバック) ---------- */

const POSITION_ORDER = { GK: 0, DF: 1, MF: 2, FW: 3 };
/* 本日(JST)時点の満年齢。生年月日は "1999-04-23T00:00:00.000Z" の形で入っているが、
   Date に通すと端末のタイムゾーン次第で前日にずれるので、fmtBirthday と同じく
   文字列のまま年月日を取り出して数える。 */
function ageFromBirthday(iso) {
  const b = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  const t = /^(\d{4})-(\d{2})-(\d{2})/.exec(todayDateStrJst());
  if (!b || !t) return null;
  let age = (+t[1]) - (+b[1]);
  // 今年の誕生日をまだ迎えていなければ1つ引く
  if ((+t[2]) < (+b[2]) || ((+t[2]) === (+b[2]) && (+t[3]) < (+b[3]))) age--;
  return (age >= 0 && age < 120) ? age : null;
}
function fmtBirthday(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  if (!m) return "－";
  return (+m[1]) + "/" + (+m[2]) + "/" + (+m[3]);
}

function uniformNoSortKey(v) {
  if (v === null || v === undefined || v === "") return 999;
  const n = Number(v);
  return Number.isFinite(n) ? n : 999;
}

function renderPlayers(clubExtra, team) {
  const c = clubExtra && clubExtra.clubs && clubExtra.clubs[team.idTeam];
  if (!c || !c.players || !c.players.length) {
    return '<section><h2>選手一覧</h2><div class="card">' +
      '<a class="btn" href="' + esc(team.playersUrl) + '" target="_blank" rel="noopener">' +
      esc(team.ja) + ' の選手一覧を見る（Jリーグ公式）</a></div></section>';
  }

  const sorted = [...c.players].sort((a, b) => {
    const pa = POSITION_ORDER[a.position] ?? 9, pb = POSITION_ORDER[b.position] ?? 9;
    if (pa !== pb) return pa - pb;
    /* 第38弾: "0" は +"0" === 0 が falsy なので 999 扱いで末尾に飛んでいた。
       ただし Number(null) も Number("") も 0 になるので、まず「値が無い」を弾いてから
       数値にする(意図は「数値なら数値順、無ければ末尾」)。 */
    return uniformNoSortKey(a.uniformNo) - uniformNoSortKey(b.uniformNo);
  });

  const rows = sorted.map(p => {
    const url = playerUrl(p.playerId);
    const nameHtml = url
      ? '<a href="' + url + '" target="_blank" rel="noopener">' + esc(p.name || "－") + '</a>'
      : esc(p.name || "－");
    return '<tr>' +
      '<td class="rank">' + esc(p.uniformNo || "－") + '</td>' +
      '<td class="p-name">' + nameHtml + (p.isHomeGrown ? ' <span class="small muted">HG</span>' : '') + '</td>' +
      '<td>' + esc(p.position || "－") + '</td>' +
      '<td class="p-age">' + (ageFromBirthday(p.birthday) ?? "－") +
        '<span class="p-bd">' + esc(fmtBirthday(p.birthday)) + '</span></td>' +
      '<td>' + (p.totalGameCount == null ? "－" : p.totalGameCount) + '</td>' +
      '<td>' + (p.totalGoalCount == null ? "－" : p.totalGoalCount) + '</td>' +
    '</tr>';
  }).join("");

  return '<section><h2>選手一覧</h2><div class="card">' +
    '<table><thead><tr>' +
      '<th class="rank">番</th><th class="p-name">選手名</th><th>位置</th><th>年齢</th><th>出場</th><th>得点</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="legend"><span>HG=ホームグロウン選手 ／ 年齢は本日時点の満年齢（下段は生年月日） ／ 出場・得点は当該シーズンのレギュラーシーズン</span></div>' +
  '</div></section>';
}

/* ---------- シーズン別成績(club_extra.json由来。折りたたみ表示) ---------- */

function renderSeasonalPerformances(clubExtra, team) {
  const c = clubExtra && clubExtra.clubs && clubExtra.clubs[team.idTeam];
  if (!c || !c.seasonalPerformances || !c.seasonalPerformances.length) return "";

  const rows = c.seasonalPerformances.map(p =>
    '<tr><td class="p-name">' + esc(p.year) + '</td><td>' + esc(p.leagueName || "－") + '</td><td><b>' + esc(p.resultLabel) + '</b></td></tr>'
  ).join("");

  return '<section><h2>シーズン別成績</h2><div class="card">' +
    '<details><summary>過去の成績を見る(' + c.seasonalPerformances.length + '件)</summary>' +
    '<table><thead><tr><th class="p-name">年度</th><th>大会</th><th>成績</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '</details>' +
  '</div></section>';
}

/* ---------- ニュース ----------
   出典は4種類:
     - official: 公式サイトのクラブページ(club_extra.json)
     - feed:     ゲキサカ/サッカーキング(リーグ全体フィードをクラブ名で振り分け。news.json)
     - google:   Google News(watchlist記載クラブのみ。news.json)
   OB選手(卒業生)は公式サイトに情報が無いため、引き続きGoogle News RSS(news.json.obPlayers)を使う。 */

/* ---------- 第32弾: マイニュース(キーワードでニュース見出しを横断検索) ----------

   仕組みは端末の中だけで完結する。キーワードはlocalStorageに置き、検索対象は
   アプリが既に読み込んでいる news.json(60クラブ×100件) と club_extra.json の公式ニュース。
   バッチもサーバーも一切触らないので、追加した瞬間に結果が出る。

   限界も正直に書いておく: 持っているのは見出しだけで本文は無い。実測(2026-08-31)では
   Jリーグの登録選手2,240人のうち、見出しに名前が出ているのは434人(19.4%)だった。
   話題になっていない選手は当たらない。そのキーワード専用にGoogle Newsを引きたい場合は
   data/config/watchlist.json の obPlayers に足してバッチを回す(サーバー側の別機能)。 */

const MY_NEWS_KEY = "jleague-app.myNewsKeywords";
const MY_NEWS_MAX_KEYWORDS = 20;
const MY_NEWS_MAX_ITEMS = 100;   // 一覧に出す上限。これを超えた分は件数だけ知らせる
const MY_NEWS_SUGGESTIONS = ["移籍", "新加入", "負傷", "監督"];

/* localStorageが使えない環境でも落ちないようにする(既存のloadFav/saveFavと同じ流儀) */
function loadMyNewsKeywords() {
  try {
    const raw = localStorage.getItem(MY_NEWS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.filter(x => typeof x === "string" && x.trim()) : [];
  } catch (e) { return []; }
}
function saveMyNewsKeywords(list) {
  try { localStorage.setItem(MY_NEWS_KEY, JSON.stringify(list)); } catch (e) { /* 無視 */ }
}
function myNewsKeywords() {
  if (state.myNewsKeywords === null) state.myNewsKeywords = loadMyNewsKeywords();
  return state.myNewsKeywords;
}
function addMyNewsKeyword(word) {
  const w = String(word || "").trim();
  if (!w) return;
  const list = myNewsKeywords();
  // 正規化して比べる。「久保建英」と「久保 建英」を二重に持たせない
  const n = normalizeForSearch(w);
  if (list.some(x => normalizeForSearch(x) === n)) return;
  if (list.length >= MY_NEWS_MAX_KEYWORDS) return;
  list.push(w);
  saveMyNewsKeywords(list);
}
function removeMyNewsKeywordAt(i) {
  const list = myNewsKeywords();
  if (i < 0 || i >= list.length) return;
  list.splice(i, 1);
  saveMyNewsKeywords(list);
}

/* 全角/半角・大文字小文字・空白のゆれを吸収する。
   NFKCが「ＦＣ東京」->「FC東京」、「ｶﾀｰﾚ」->「カターレ」をまとめて片付けてくれる。
   空白を落とすのは、見出し側が「久保 建英」でキーワードが「久保建英」でも当てたいため。 */
function normalizeForSearch(str) {
  return String(str || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
}

/* ニュース全件を1本の配列にする。newsItemHtml() が公式記事のURLを組み立てるのに
   navicode(リーグ)を要るので、どのクラブ由来かをここで持たせておく。 */
/* 第37弾: 正規化済みの見出しを1度だけ作って使い回す。
   検索対象は約6,360件(60クラブ×100件 + 公式360件 + world)あり、描画のたびに全件へ
   NFKC正規化をかけていた。試合中は liveTick が60秒ごとに再描画するので特に効く。
   state.news / state.clubExtra が入れ替わったら clearStaticCaches が null に戻す。 */
let myNewsEntriesCache = null;

function allNewsEntries(news, clubExtra) {
  if (myNewsEntriesCache && myNewsEntriesCache.news === news && myNewsEntriesCache.clubExtra === clubExtra) {
    return myNewsEntriesCache.entries;
  }
  const out = [];
  const teams = (news && news.teams) || {};
  for (const idTeam of Object.keys(teams)) {
    const found = findTeam(idTeam);
    const lg = found ? found.league : state.league;
    for (const item of teams[idTeam] || []) out.push({ item: item, league: lg });
  }
  const clubs = (clubExtra && clubExtra.clubs) || {};
  for (const idTeam of Object.keys(clubs)) {
    const found = findTeam(idTeam);
    const lg = found ? found.league : state.league;
    for (const item of (clubs[idTeam].news || [])) {
      out.push({ item: Object.assign({ sourceType: "official" }, item), league: lg });
    }
  }
  /* 第33弾: どのJクラブにも紐づかなかったフィード記事(海外サッカーなど)。
     海外移籍した元Jリーグの選手を追うのはここに入る。リーグを持たないが、
     sourceTypeが"feed"でlinkをそのまま使うため newsItemHtml() は league を見ない。 */
  for (const item of (news && news.world) || []) {
    out.push({ item: item, league: state.league });
  }
  for (const e of out) e.normTitle = normalizeForSearch(e.item.title);
  myNewsEntriesCache = { news: news, clubExtra: clubExtra, entries: out };
  return out;
}

/* 重複判定のキー。Google News経由の記事は「見出し - 媒体名」の形で来るが、同じ記事が
   複数の媒体に配信されるとURLもタイトルも違うため、fetch_news.py側の重複除去
   (URL正規化・タイトル完全一致)をすり抜ける。実測では「守田、坂元が初出場 サッカー」が
   甲府/山口宇部/相模原町田/水戸の各経済新聞ぶん4件並んだ。
   末尾の「 - 媒体名」を落としたものをキーにして畳む。表示するタイトルは元のまま。
   媒体名は30文字までとし、区切りの前後に空白がある場合だけ落とす(見出しの中の
   ハイフンを誤って切らないため)。 */
function newsDedupeKey(item) {
  const raw = String(item.title || "").replace(/\s[-–—]\s[^-–—]{1,30}$/, "");
  return normalizeForSearch(raw) || item.link || item.id || "";
}

/* 同じ記事が複数クラブの一覧に入っていることもある(対戦相手の名前が入った試合レポートなど)。
   先に新しい順へ並べてから畳むので、残るのは常に一番新しい1件。
   キーワードごとの件数も畳んだ後の数で数える(チップの数字と一覧の件数を一致させる)。 */
function searchMyNews(entries, keywords) {
  const norm = keywords.map(k => ({ raw: k, n: normalizeForSearch(k) })).filter(k => k.n);
  const counts = {};
  for (const k of keywords) counts[k] = 0;
  if (!norm.length) return { hits: [], counts: counts, scanned: entries.length };

  const matched = [];
  for (const e of entries) {
    const title = e.normTitle !== undefined ? e.normTitle : normalizeForSearch(e.item.title);
    const hitKeys = norm.filter(k => title.indexOf(k.n) >= 0);
    if (!hitKeys.length) continue;
    matched.push({ item: e.item, league: e.league, matched: hitKeys.map(k => k.raw) });
  }
  matched.sort((a, b) => byPublishedDesc(a.item, b.item));

  const seen = new Set();
  const hits = [];
  for (const m of matched) {
    const key = newsDedupeKey(m.item);
    if (seen.has(key)) continue;
    seen.add(key);
    for (const k of m.matched) counts[k]++;
    hits.push(m);
  }
  return { hits: hits, counts: counts, scanned: entries.length };
}

/* 見出しの中の一致部分を <mark> で囲む。
   エスケープ済みのHTMLに対して置換すると &amp; のような実体参照の中を壊しうるので、
   素のタイトル上で位置を出し、切り出した断片それぞれをesc()してから組み立てる。
   NFKCで正規化して当てているため、素のタイトル上には位置が無いこともある
   (「ＦＣ東京」に「FC東京」で当たった場合など)。そのときは強調しないだけで一覧からは外さない。 */
function highlightedTitleHtml(title, keywords) {
  const raw = String(title || "");
  if (!keywords || !keywords.length) return esc(raw);
  const lower = raw.toLowerCase();
  const spans = [];
  for (const kw of keywords) {
    const k = String(kw || "").toLowerCase();
    if (!k) continue;
    let i = lower.indexOf(k);
    while (i >= 0) { spans.push([i, i + k.length]); i = lower.indexOf(k, i + k.length); }
  }
  if (!spans.length) return esc(raw);
  spans.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const sp of spans) {
    const last = merged[merged.length - 1];
    if (last && sp[0] <= last[1]) last[1] = Math.max(last[1], sp[1]);
    else merged.push([sp[0], sp[1]]);
  }
  let out = "", pos = 0;
  for (const m of merged) {
    out += esc(raw.slice(pos, m[0])) + '<mark>' + esc(raw.slice(m[0], m[1])) + '</mark>';
    pos = m[1];
  }
  return out + esc(raw.slice(pos));
}

function myNewsChipsHtml(keywords, counts) {
  return keywords.map((kw, i) => {
    const n = counts[kw] || 0;
    return '<span class="mynews-chip">' + esc(kw) +
      '<span class="mynews-count' + (n ? '' : ' zero') + '">' + n + '</span>' +
      '<button type="button" data-mynews-remove="' + i + '" aria-label="' + esc(kw) + ' を削除">✕</button>' +
    '</span>';
  }).join("");
}

function renderMyNewsTab() {
  const keywords = myNewsKeywords();
  const entries = allNewsEntries(state.newsAll, state.clubExtra);
  const res = searchMyNews(entries, keywords);

  const form =
    '<div class="mynews-form">' +
      '<input type="text" id="myNewsInput" placeholder="選手名・キーワード" maxlength="40" ' +
        'autocomplete="off" enterkeyhint="done" aria-label="追加するキーワード">' +
      '<button type="button" data-mynews-add>追加</button>' +
    '</div>';

  let manage;
  if (!keywords.length) {
    manage = form +
      '<p class="muted" style="margin:0 0 8px">キーワードを登録すると、集めてある' +
        res.scanned.toLocaleString() + '件のニュース見出し(Jリーグ60クラブ＋海外サッカー)から、' +
        '一致するものを新しい順に並べます。</p>' +
      '<div class="mynews-chips">' +
        MY_NEWS_SUGGESTIONS.map(w =>
          '<button type="button" class="chart-chip" data-mynews-add="' + esc(w) + '">＋ ' + esc(w) + '</button>').join("") +
      '</div>';
  } else {
    const zeros = keywords.filter(k => !res.counts[k]);
    manage = form + '<div class="mynews-chips">' + myNewsChipsHtml(keywords, res.counts) + '</div>' +
      // 0件のキーワードは消し忘れではなく「いま話題が無いだけ」。理由を書いておかないと壊れて見える。
      (zeros.length
        ? '<p class="muted" style="margin:8px 0 0">' + esc(zeros.join("・")) +
          ' はいまの見出しに出ていません。話題になれば自動で並びます。</p>' : '') +
      (keywords.length >= MY_NEWS_MAX_KEYWORDS
        ? '<p class="muted" style="margin:8px 0 0">キーワードは' + MY_NEWS_MAX_KEYWORDS + '個までです。</p>' : '');
  }

  let listHtml;
  if (!keywords.length) {
    listHtml = "";
  } else if (!res.hits.length) {
    listHtml = '<section><h2>ヒットした記事</h2><div class="card">' +
      '<p class="muted" style="margin:0">一致する見出しがありませんでした。' +
      '見ているのは60クラブぶんのニュースと海外サッカーの見出しだけなので、' +
      'いま話題になっていない選手は当たらないことがあります。</p>' +
      '</div></section>';
  } else {
    const shown = res.hits.slice(0, MY_NEWS_MAX_ITEMS);
    const rest = res.hits.length - shown.length;
    listHtml = '<section><h2>ヒットした記事(' + res.hits.length + '件)</h2><div class="card">' +
      '<ul class="news-list">' +
        shown.map(h => newsItemHtml(h.item, h.league, h.matched)).join("") +
      '</ul>' +
      (rest > 0 ? '<p class="muted" style="margin:10px 0 0">新しい順に' + MY_NEWS_MAX_ITEMS +
        '件まで表示しています(他' + rest + '件)。</p>' : '') +
    '</div></section>';
  }

  return '<section><h2>マイニュース</h2><div class="card">' + manage + '</div></section>' + listHtml;
}

function rssNewsItemHtml(item) {
  return '<li class="news-item">' +
    '<div class="news-item-body">' +
      '<a href="' + esc(item.link) + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>' +
      '<div class="news-meta">' +
        (item.publishedJst ? '<span class="num">' + esc(fmtDate(item.publishedJst, false)) + '</span>' : '') +
        (item.source ? '<span class="news-src">' + esc(item.source) + '</span>' : '') +
      '</div>' +
    '</div>' +
  '</li>';
}

const NEWS_SOURCE_LABEL = { official: "Jリーグ公式", soccerdigest: "サッカーダイジェストWeb" };

/* 画像は元サイト由来のURLをそのまま参照(ホットリンク)するだけで、ダウンロード・保存はしない。
   imageUrlが無いニュースはサムネイル枠自体を出さない(グレーのプレースホルダは置かない)。
   元サイトのURLが変わって読み込みに失敗した場合は onerror で要素ごと消し、リンク切れアイコンを出さない。
   第14弾: サッカーダイジェストWeb(soccerdigest)もimageUrlを持つので、公式と同様にサムネイルを出す。 */
/* keywords を渡すと、見出しの中の一致部分を <mark> で囲む(第32弾のマイニュース用)。
   渡さなければ従来どおり esc() したそのままの見出しになる。 */
function newsItemHtml(item, league, keywords) {
  const isOfficial = item.sourceType === "official";
  const url = isOfficial
    ? "https://www.jleague.jp/news/article/" + encodeURIComponent(item.id) + "/?navicode=" + esc(league)
    : item.link;
  const thumb = (isOfficial || item.sourceType === "soccerdigest") && item.imageUrl
    ? '<img class="news-thumb" src="' + esc(item.imageUrl) + '" alt="" loading="lazy" onerror="this.remove()">'
    : "";
  const sourceLabel = NEWS_SOURCE_LABEL[item.sourceType] || item.source || "";
  return '<li class="news-item">' +
    thumb +
    '<div class="news-item-body">' +
      '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + highlightedTitleHtml(item.title, keywords) + '</a>' +
      '<div class="news-meta">' +
        (item.publishedJst ? '<span class="num">' + esc(fmtDate(item.publishedJst, false)) + '</span>' : '') +
        (sourceLabel ? '<span class="news-src">' + esc(sourceLabel) + '</span>' : '') +
      '</div>' +
    '</div>' +
  '</li>';
}

function renderNews(news, clubExtra, team, league) {
  const c = clubExtra && clubExtra.clubs && clubExtra.clubs[team.idTeam];
  const officialItems = ((c && c.news) || []).map(it => Object.assign({ sourceType: "official" }, it));
  const teamNewsItems = (news && news.teams && news.teams[team.idTeam]) || [];
  // 公式+ゲキサカ+サッカーキング+Google Newsをまとめて新しい順に1本の一覧にする
  const combined = officialItems.concat(teamNewsItems)
    .sort(byPublishedDesc);

  const obPlayers = (news && news.obPlayers) || {};
  const obNames = Object.keys(obPlayers).filter(name => (obPlayers[name] || []).length);

  if (!combined.length && !obNames.length) return "";

  let mainHtml;
  if (!combined.length) {
    mainHtml = '<p class="muted" style="margin:0">関連ニュースが見つかりませんでした。</p>';
  } else {
    mainHtml = '<ul class="news-list">' + combined.map(item => newsItemHtml(item, league)).join("") + '</ul>';
  }

  const obHtml = obNames.map(name => {
    const items = obPlayers[name].slice(0, 10);
    return '<div class="news-ob"><h3 class="news-ob-name">' + esc(name) + ' のニュース</h3>' +
      '<ul class="news-list">' + items.map(rssNewsItemHtml).join("") + '</ul></div>';
  }).join("");

  return '<section><h2>ニュース</h2><div class="card">' + mainHtml + obHtml + '</div></section>';
}

init();
</script>
</body>
</html>
