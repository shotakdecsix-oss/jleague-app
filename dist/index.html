}
/* 第23弾フェーズ2: 天皇杯の試合詳細(出場メンバー/交代/カード/JFATVの動画)。
   scripts/fetch_emperors_cup_events.py が生成する。キーは matchNumber の文字列。
   まだ無くても構わない(ドリルダウンが出ないだけ)。 */
async function ensureEmperorsCupEvents() {
  if (state.emperorsCupEvents === undefined) state.emperorsCupEvents = await getJsonOptional("data/processed/emperors_cup_events.json");
  return state.emperorsCupEvents;
}
/* 第36弾: ルヴァンカップ。日程・結果は fetch_leaguecup.py、試合詳細は fetch_match_events.py
   (J1〜J3と同じ形式)。天皇杯と違って出どころがJFAではなくjleague.jpなので別ファイルになる。 */
async function ensureLeagueCup() {
  if (state.leagueCup === undefined) state.leagueCup = await getJsonOptional("data/processed/leaguecup.json");
  return state.leagueCup;
}
async function ensureLeagueCupEvents() {
  if (state.leagueCupEvents === undefined) state.leagueCupEvents = await getJsonOptional("data/processed/leaguecup_match_events.json");
  return state.leagueCupEvents;
}
function findLeagueCupEvents(code) {
  const d = state.leagueCupEvents;
  return (d && d.events) ? (d.events[String(code)] || null) : null;
}

function findCupEvents(matchNumber) {
  const d = state.emperorsCupEvents;
  return (d && d.events) ? (d.events[String(matchNumber)] || null) : null;
}
async function ensureTabData(league, tabId) {
  if (tabId === "mynews") {
    // 第32弾: マイニュースはクラブ横断。第26弾でニュースを分割したので、ここだけ全件を取る
    await ensureNewsAll();
    await ensureClubExtra();
    return;
  }
  if (tabId === "home") {
    await ensureMatches(league);
    await ensureSimulation(league);
    await ensureImpact(league);
    await ensureStandings(league); // 第28弾: 序盤に出す順位ミニ表。gzip後で数KBなので追加コストはほぼ無い
    await ensureMatchEvents(league); // 第13弾: 自クラブの進行中判定(derivedScoreFromEvents)に必要
  } else if (tabId === "schedule") {
    await ensureMatches(league); // 全380試合が既に入っているので追加取得は不要
    await ensureMatchEvents(league); // 第13弾: 得点/カード/交代(進行中・直近の試合のみ)
  } else if (tabId === "standings") {
    await ensureStandings(league);
    await ensureMatches(league); // 第10弾: 暫定順位の判定(オンデマンド有効かどうか)に必要
    await ensureRankHistory(league); // 第16弾: 順位推移グラフ
  } else if (tabId === "stats") {
    await ensureStats(league);
    await ensureRpg(league); // 第40弾: ステータス(RPG風)のサブタブ
    await ensureMatches(league); // 確率推移グラフの自クラブ試合結果マーカー用
    await ensureHistory(league);
  } else if (tabId === "players") {
    await ensureClubExtra();
  } else if (tabId === "news") {
    await ensureClubExtra();
    await ensureNews();
  }
}

/* ---------- 起動 ---------- */

/* ---------- 第30弾: 配信されている版と、いま動いているHTMLの版を比べる ---------- */

/* build_dist.py が dist/index.html に版数を焼き込んでいない = ローカルで直接開いている。
   その場合は比較しても意味がないので、更新検知そのものを止める。 */
function isBuiltCopy() {
  return APP_BUILD_VERSION !== APP_BUILD_VERSION_PLACEHOLDER;
}
/* latest は deploy-version.txt の中身。取れなかった(null)ときは古いと判断しない。 */
function isStaleBuild(latest) {
  return !!(isBuiltCopy() && latest && latest !== APP_BUILD_VERSION);
}
/* 第37弾: 表示先はヘッダーのバッジからiのポップオーバーに移った。
   開いていないときは何もしない(次に開いたときに最新の値で組み立て直される)。 */
function updateDeployBadge() {
  updateOndemandPopoverInPlace();
}
function showUpdateBanner() {
  const el = document.getElementById("updateBanner");
  if (el) el.hidden = false;
}
/* 自動リロードはしない。試合を見ながら操作している最中に画面が飛ぶ方が困る。
   定期ポーリングも足さない。可視復帰のたびに数十バイトのテキストを1回取るだけで足りる。 */
async function checkForNewDeploy() {
  if (!isBuiltCopy()) return;
  const latest = await getTextOptional("deploy-version.txt");
  if (!latest) return;
  state.deployVersion = latest;
  updateDeployBadge();
  if (isStaleBuild(latest)) showUpdateBanner();
}

async function init() {
  const app = document.getElementById("app");
  try {
    const leagueKeys = Object.keys(LEAGUES);
    const masterList = await Promise.all(leagueKeys.map(k => getJson(LEAGUES[k].master)));
    leagueKeys.forEach((k, i) => { state.masters[k] = masterList[i]; });
    // 第14弾: チームカラー装飾用に、全リーグ横断のidTeam->チーム情報を1つにまとめておく
    for (const key of Object.keys(LEAGUES)) {
      /* 第38弾: リーグも一緒に持たせる。findTeam が 3リーグ×20クラブを毎回線形走査していて、
         allNewsEntries ではクラブ数ぶんループ内から呼ばれていた。 */
      for (const t of state.masters[key].teams) state.teamsById[t.idTeam] = Object.assign({ league: key }, t);
    }
  } catch (e) {
    app.innerHTML = '<div class="err"><b>データを読み込めませんでした。</b><br>' + esc(e.message) +
      '<br><br>プロジェクトのルートで <code>python -m http.server 8000</code> を起動し、' +
      '<code>http://localhost:8000/</code> を開いてください。' +
      'ファイルを直接ダブルクリックで開くとブラウザがJSONの読み込みを拒否します。</div>';
    return;
  }

  // デプロイ日時・バージョン(デバッグ用、ヘッダーに小さく出す)。無くても/失敗してもアプリ本体には影響させない。
  Promise.all([getTextOptional("deploy-time.txt"), getTextOptional("deploy-version.txt")]).then(([t, v]) => {
    state.deployTime = t;
    state.deployVersion = v;
    updateDeployBadge();
    if (isStaleBuild(v)) showUpdateBanner(); // 第30弾: 起動した時点で既に古いこともある
  });

  applyRouteFromHash();
  renderTabButtons();
  bindTabBarEvents();
  updateTabBarActive();
  updateModeToggleActive();

  buildSelect();

  const saved = loadFav();
  const initial = (saved && findTeam(saved)) ? saved : findFavoriteTeam();
  document.getElementById("clubSelect").value = initial;
  await selectTeam(initial);

  document.getElementById("themeToggleBtn").addEventListener("click", toggleTheme);
  updateThemeToggleBtn();
  /* 明示的に選ぶ前(auto)だけ、OS側の切り替えに追随する。一度自分で選んだら追随しない。 */
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onSchemeChange = () => { if (loadThemePref() === "auto") applyResolvedTheme(); };
    if (mq.addEventListener) mq.addEventListener("change", onSchemeChange);
    else if (mq.addListener) mq.addListener(onSchemeChange);
  }

  document.getElementById("clubSelect").addEventListener("change", ev => {
    saveFav(ev.target.value);
    selectTeam(ev.target.value);
  });

  window.addEventListener("hashchange", () => {
    const route = currentRouteFromHash();
    if (!route) return;
    const modeChanged = route.mode !== state.viewMode;
    state.viewMode = route.mode;
    if (route.mode === "club") state.activeTab = route.tab;
    else state.allTab = route.tab;
    if (route.mode === "all" && route.tab === "schedule") state.calNeedsScroll = true;
    if (modeChanged) {
      saveViewMode(route.mode);
      renderTabButtons();
      applyThemeForMode();
      updateModeToggleActive();
    }
    updateTabBarActive();
    renderActiveTab();
  });

  // 第32弾: マイニュースの入力欄はEnterでも追加できるようにする(スマホの「完了」キー)。
  // formにしないのは、Enterでページごとsubmit(=リロード)されるのを避けるため。
  document.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" || !ev.target || ev.target.id !== "myNewsInput") return;
    ev.preventDefault();
    addMyNewsKeyword(ev.target.value);
    ev.target.value = "";
    rerenderKeepingMyNewsFocus();
  });

  /* 第37弾: Enter/Spaceで行の詳細を開けるようにする。
     行は div のままなので(レイアウトを崩さないため)、tabindex と role は描画側で付け、
     キー操作はここで click と同じ経路に合流させる。 */
  /* 第38弾: Escでポップオーバーを閉じ、フォーカスをiボタンへ戻す。
     中にトークン入力欄があるので、閉じる手段がキーボードから無いのは困る。 */
  document.addEventListener("keydown", ev => {
    if (ev.key !== "Escape" || !state.ondemandPopoverOpen) return;
    state.ondemandPopoverOpen = false;
    const btn = document.getElementById("ondemandInfoBtn");
    if (btn) btn.setAttribute("aria-expanded", "false");

    if (btn) btn.focus();

  document.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    const row = ev.target && ev.target.closest && ev.target.closest("[data-eventsrow],[data-predictrow],[data-idteam]");
    if (!row) return;
    ev.preventDefault();
    row.click();
  });

  // イベント委譲: クラブ名クリックでの切替(data-idteam)とレーダーの頂点タップ(ツールチップ)を1つのリスナーで拾う。
  // 行ごと/要素ごとにリスナーを張らないこと。
  document.addEventListener("click", ev => {
    // 第32弾: マイニュースのキーワード追加/削除。
    // data-mynews-add に値があればそれを(候補チップ)、無ければ入力欄の中身を足す。
    const myAdd = ev.target.closest("[data-mynews-add]");
    if (myAdd) {

    const myDel = ev.target.closest("[data-mynews-remove]");

    // 第36弾: カップの大会切替。ラウンドは大会ごとに違うので選び直させる
    const cupKindBtn = ev.target.closest("[data-cupkind]");

    const teamLinkBtn = ev.target.closest("[data-idteam]");

      const idTeam = teamLinkBtn.dataset.idteam;
      if (idTeam && idTeam !== state.idTeam && findTeam(idTeam)) {

    const eventsRowBtn = ev.target.closest("[data-eventsrow]");

    const groupBtn = ev.target.closest("[data-statsgroup]");
    if (groupBtn) {
      state.statsGroup = groupBtn.dataset.statsgroup;
      renderActiveTab();
      return;
    }

    const modeBtn = ev.target.closest("[data-schedulemode]");
    if (modeBtn) {
      state.scheduleMode = modeBtn.dataset.schedulemode;
      renderActiveTab();
      return;
    }

    // 第28弾: 順位表の表示範囲(全体 / 自分の周辺)
    const stScopeBtn = ev.target.closest("[data-stscope]");
    if (stScopeBtn) {
      state.standingsScope = stScopeBtn.dataset.stscope;
      saveStandingsScope(state.standingsScope);
      renderActiveTab();
      return;
    }

    const seriesBtn = ev.target.closest("[data-chartseries]");
    if (seriesBtn) {
      state.chartSeries = seriesBtn.dataset.chartseries;
      renderActiveTab();
      return;
    }

    const chipBtn = ev.target.closest("[data-chartclub]");
    if (chipBtn) {
      const tid = chipBtn.dataset.chartclub;
      const list = state.chartClubs || [];
      if (list.includes(tid)) {
        state.chartClubs = list.filter(x => x !== tid);
      } else if (list.length < 5) {
        state.chartClubs = list.concat([tid]);
      }
      renderActiveTab();
      return;
    }

    // 第17弾: 順位推移グラフの右端に出すクラブ名タップでハイライト切替(同じクラブを再タップで自クラブに戻す)
    const rankTeamBtn = ev.target.closest("[data-rankteam]");
    if (rankTeamBtn) {
      const tid = rankTeamBtn.dataset.rankteam;
      state.rankHighlightTeam = (state.rankHighlightTeam === tid) ? null : tid;
      renderActiveTab();
      return;
    }

    const copyBtn = ev.target.closest("[data-icscopy]");
    if (copyBtn) {
      const url = copyBtn.dataset.icscopy;
      const done = () => {
        const original = "URLをコピー";
        copyBtn.textContent = "コピーしました";
        setTimeout(() => { copyBtn.textContent = original; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done).catch(() => {});
      }
      return;
    }

  });

  // 日程タブの節セレクタ(再描画のたびに要素が作り直されるのでイベント委譲で拾う)
  document.addEventListener("change", ev => {
    if (ev.target && ev.target.id === "roundJump") {
      state.scheduleRound = Number(ev.target.value);
      state.schedNeedsScroll = true;   // 第37弾: 利用者が選んだときだけスクロールする
      renderActiveTab();
    }
  });

  // 第12弾: バックグラウンドの間はポーリングを止め、可視に戻ったら即1回取得してから再開する(3-3章)。
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      stopLivePolling();
    } else {
      evaluateLiveSchedule();
      maybeRefreshStaticOnVisible(); // 第30弾: 静的JSONも見直す(5分の間引きつき)
      checkForNewDeploy();           // 第30弾: 新しい版が出ていないか確認する
    }
  });
  // 起動直後(試合中にアプリを開いた場合)の判定。
  evaluateLiveSchedule();
  // キックオフ前にアプリを開いたまま何もトリガが無い状態が続いても、時間経過でキックオフを検知できるように
  // する保険(5分おき。稼働中は何もしない=livescore.phpへは候補が生まれたときしか投げない)。
  setInterval(() => { if (!livePollTimer) evaluateLiveSchedule(); }, 5 * 60 * 1000);

  /* 第25弾: Service Workerの登録。ここは init() のいちばん最後に置く。
     登録が失敗してもアプリ本体は通常どおり動く(オフラインで開けなくなるだけ)なので、
     データ読み込みの成否に関わらず最後に一度だけ試す。
     file:// で開いたときやSW非対応のブラウザでは黙って何もしない。 */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    /* updateViaCache:"none" … ブラウザのHTTPキャッシュを経由せずに sw.js を取りに行く。
       これが無いと、CDNやブラウザが sw.js を握っている間は新しいSWが端末に届かず、
       index.html を直しても古い画面が張り付いたままになる。 */
    const registerSw = () => {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
        .catch(() => { /* 無視 */ });
    };
    /* load を待つのは、起動直後の通信をデータ取得に譲るため。ただし init() は await を
       挟みながら進むので、ここに来た時点で既に load が終わっていることがある。
       その場合 addEventListener("load") は二度と発火しない(Playwrightで実測: SWが
       まったく登録されなかった)ので、readyState を見て直接呼ぶ。 */
    if (document.readyState === "complete") registerSw();
    else window.addEventListener("load", registerSw, { once: true });
  }

  /* 第27弾: スマホの操作。どちらも document に1回だけ付ける(#appは毎回作り直されるため)。
     スワイプは「横 > 縦×1.5」、引っ張って更新は「一番上から下向き」を条件にするので、
     同じ touchstart を見ていても同時には成立しない。 */
  bindSwipeNavigation();
  bindPullToRefresh();
}

/* ---------- 描画(タブごと) ---------- */

/* タブ切替中のつなぎ。高さのある箱を出すことで、本来の中身が入ったときの
   レイアウトの飛びを抑える。中身の正確な形を模す必要はない。 */
const LOADING_HTML =
  '<section><div class="skeleton" aria-busy="true" aria-label="読み込み中">' +
  '<div class="skeleton-line"></div><div class="skeleton-line"></div>' +
  '<div class="skeleton-line"></div><div class="skeleton-line"></div>' +
  '</div></section>';

/* 第37弾: #app を丸ごと差し替えるとフォーカスが body に飛ぶ。マイニュースは
   キーワードを続けて登録する画面なので、入力欄のフォーカスとカーソル位置を復元する
   (iOSでは復元しないとソフトキーボードが毎回閉じる)。 */
/* 第38弾: 行をタップして詳細を開いたとき、その行が画面上の同じ位置に留まるようにする。

   #app を innerHTML で丸ごと差し替えているため、開いた直後にスクロール位置が動いて
   「開いた試合の一番下」に飛んでしまっていた。ノードが全部作り直されるので、
   ブラウザのスクロールアンカリングが効かない(どのノードを基準にすればよいか分からない)。

   差し替えの前にその行の画面上の位置(viewportからの距離)を控えておき、
   差し替え後に同じ行を探して、その位置へ戻るぶんだけスクロールし直す。
   詳細パネルは行の下に開くので、行の上端を固定すれば「開いた試合の頭」が見えたままになる。 */
function findEventsRow(key) {
  for (const el of document.querySelectorAll("[data-eventsrow]")) {
    if (el.dataset.eventsrow === key) return el;
  }
  return null;
}

async function rerenderKeepingRowAnchor(key) {
  await rerenderKeepingAnchor(() => findEventsRow(key));
}

/* find は「差し替えの前後で同じものを指す要素」を返す関数。
   カレンダーの「さらに前を見る」でも、先頭に14日ぶんの行が差し込まれて見ていた日付が
   飛んでいたので、同じ仕掛けで位置を戻す。 */
async function rerenderKeepingAnchor(find) {
  const before = find();
  const topBefore = before ? before.getBoundingClientRect().top : null;
  await renderActiveTab();
  if (topBefore == null) return;
  const after = find();
  if (!after) return;
  const delta = after.getBoundingClientRect().top - topBefore;
  if (delta) window.scrollBy(0, delta);
}

async function rerenderKeepingMyNewsFocus() {
  await renderActiveTab();
  const input = document.getElementById("myNewsInput");
  if (input) { input.focus(); try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) { /* 無視 */ } }
}

async function renderActiveTab() {
  if (state.viewMode === "all") {
    await renderAllModeActiveTab();
    return;
  }
  const found = findTeam(state.idTeam);
  if (!found) return;
  const { league, team } = found;
  const master = state.masters[league];
  const app = document.getElementById("app");
  app.innerHTML = LOADING_HTML;

  /* 第37弾: 以前は ensureTabData だけを包んでいたため、描画側で例外が出ると
     app.innerHTML が LOADING_HTML のまま固まり、エラーも出ずリロード以外に復帰手段が
     無かった。データ取得と描画をまとめて包む。 */
  try {
    await ensureTabData(league, state.activeTab);
    renderActiveTabBody(league, team, master, app);
  } catch (e) {
    app.innerHTML = '<div class="err">' + esc((e && e.message) || "描画に失敗しました") + '</div>';
  }
}

function renderActiveTabBody(league, team, master, app) {

  const cache = leagueCache(league);
  const venues = master.venues || {};
  // 第10弾: オンデマンドで取得した最新結果があればここでマージ済みの配列になる(無ければバッチのまま)
  const all = effectiveMatches(league);
  const mine = all.filter(m => m.home.idTeam === team.idTeam || m.away.idTeam === team.idTeam);

  let html;
  if (state.activeTab === "schedule") {
    const matchesForDisplay = cache.matches ? Object.assign({}, cache.matches, { matches: all }) : cache.matches;
    html = renderScheduleTab(matchesForDisplay, team, league);
  } else if (state.activeTab === "standings") {
    const provisional = hasOndemandForLeague(league);
    const standingsForDisplay = provisional
      ? { table: computeProvisionalTable(all, master), meta: cache.standings && cache.standings.meta }
      : cache.standings;
    html = renderStandings(standingsForDisplay, team, master, provisional, cache.rankHistory, league);
  } else if (state.activeTab === "stats") {
    html = renderStatsTab(cache.stats, team) + renderProbabilityChart(cache.history, all, team, master, league);
  } else if (state.activeTab === "players") {
    html = renderLeaders(state.clubExtra, team) + renderPlayers(state.clubExtra, team) + renderSeasonalPerformances(state.clubExtra, team);
  } else if (state.activeTab === "mynews") {
    html = renderMyNewsTab();
  } else if (state.activeTab === "news") {
    const newsHtml = renderNews(state.news, state.clubExtra, team, league);
    html = newsHtml || '<section><h2>ニュース</h2><div class="card"><p class="muted" style="margin:0">関連ニュースが見つかりませんでした。</p></div></section>';
  } else {
    // 改訂2: 更新ボタンはホームタブから外し、ヘッダに移した(クラブ単位の操作に見えないようにするため)
    // 第12弾: 自クラブが試合中のときは「次の試合」カードの代わりに「試合中」カードを出す(同じ試合を二重表示しない)
    const liveMatch = findLiveMatchForTeam(team.idTeam);
    const derivedLive = liveMatch ? null : findDerivedLiveMatchForTeam(mine, league);
    const nextOrLiveHtml = liveMatch
      ? renderLiveCard(liveMatch, team)
      : (derivedLive ? renderDerivedLiveCard(derivedLive.match, derivedLive.derived, team) : renderNext(mine, team, venues));
    /* 第28弾: シーズン序盤は、昇格/残留確率がリーグ平均に寄っていてほとんど動かない。
       それが画面でいちばん大きい面積を占め、アプリ自身が「まだ大きく動きます」と
       注記を添えている状態だった。注記で守るのではなく並び順で守る。
       変えるのは early のときだけで、mid/late は従来と1ピクセルも変わらない。 */
    const stage = seasonStage(all, master.promotionRules);
    /* 順位タブと同じ暫定判定をここでも通す。これを省くと、オンデマンド更新の直後に
       「順位タブは暫定順位、ホームのミニ表は更新前の順位」というちぐはぐが起きる。 */
    const homeProvisional = hasOndemandForLeague(league);
    const homeStandings = homeProvisional
      ? { table: computeProvisionalTable(all, master), meta: cache.standings && cache.standings.meta }
      : cache.standings;
    const nearbyHtml = (stage === "early" && homeStandings)
      ? standingsSectionHtml(homeStandings, master, {
          heading: "順位表", ownIdTeam: team.idTeam, league: league,
          provisional: homeProvisional,
          focus: { idTeam: team.idTeam, around: 3 },
        })
      : "";
    html = nextOrLiveHtml + renderResults(mine, team, league) + nearbyHtml +
      renderPromotion(cache.simulation, team, all, master.promotionRules, league) +
      renderImpactSection(cache.impact, team, master.promotionRules, league);
  }
  app.innerHTML = html;

  /* 第37弾: 「日程タブである」だけを条件にしていたため、試合中に liveTick が60秒ごとに
     再描画するたび、選択中の節の先頭へ引き戻されていた。全体モード日程の calNeedsScroll と
     同じく「1回だけ立てるフラグ」に揃える。 */
  if (state.activeTab === "schedule" && state.scheduleRound != null && state.schedNeedsScroll) {
    state.schedNeedsScroll = false;
    const target = document.getElementById("round-" + state.scheduleRound);
    if (target) target.scrollIntoView({ block: "start" });
  }

  const genMeta = (cache.matches && cache.matches.meta) || (cache.standings && cache.standings.meta) || (cache.stats && cache.stats.meta);
  const gen = genMeta && genMeta.generatedAtJst;
  document.getElementById("footer").textContent =
    "データ取得: " + (gen ? fmtDate(gen, true) : "不明") + " ／ 出典: TheSportsDB";
  updateOndemandHeaderBtn();
  updateOndemandPopoverInPlace();
}

/* ---------- 第23弾: 天皇杯(JFA) ----------
   出典は www.jfa.jp。Jリーグ公式(jleague.jp)ともTheSportsDBとも別系統なので、
   idEvent等の既存キーは一切持っていない。突き合わせは fetch_emperors_cup.py 側で
   チーム名 -> idTeam の照合だけ済ませてあり、都道府県代表(アマチュア)は idTeam=null になる。
   フェーズ1は日程/結果/得点者まで。カード・交代・出場メンバー・ハイライトはフェーズ2。 */

/* 表示中のラウンドの初期値。自クラブが勝ち上がっている最後のラウンド ->
   未消化の試合が最初に出てくるラウンド -> 最終ラウンド の順に決める。 */
function defaultCupRound(data, found) {
  const rounds = (data && data.rounds) || [];
  if (!rounds.length) return null;
  const matches = data.matches || [];
  const ownId = found ? found.team.idTeam : null;
  if (ownId) {
    const mine = matches.filter(m => m.home.idTeam === ownId || m.away.idTeam === ownId);
    if (mine.length) return mine[mine.length - 1].round;
  }
  const pending = matches.find(m => !m.finished);
  return pending ? pending.round : rounds[rounds.length - 1];
}

/* ---------- 第23弾フェーズ2: 天皇杯の試合詳細 ----------
   出典はJFAの個別試合ページ(scripts/fetch_emperors_cup_events.py)。
   jleague.jp側と違いJFAは選手ページを持たないため、選手名は文字列のみでリンクは作れない。
   得点者はフェーズ1のemperors_cup.json(scorers)から作り、カード/交代/メンバー/動画を
   フェーズ2のemperors_cup_events.jsonから足す。 */

function cupHasLineups(ev) {
  return !!(ev && ev.lineups && ev.lineups.home && (ev.lineups.home.starters || []).length);
}

/* 「45+1」「HT」など数字でない表記も混ざる。数字のものは分として、HTは前半終了直後に並べる。 */
function cupMinuteSortKey(v) {
  const s = String(v == null ? "" : v);
  const m = /^(\d+)(?:\+(\d+))?$/.exec(s);
  if (m) return +m[1] + (m[2] ? +m[2] / 100 : 0);
  if (s === "HT") return 45.9;
  return 9999;
}
function cupMinuteLabel(v) {
  const s = String(v == null ? "" : v);
  return /^\d/.test(s) ? s + "'" : s;
}

function cupSidePlayersHtml(side, teamName) {
  if (!side) return "";
  const li = p => '<li><span class="lineups-pos">' + esc(p.pos || "") + '</span>' +
    '<span class="lineups-num">' + esc(p.no || "") + '</span>' + esc(p.name) +
    (p.captain ? ' <span class="events-sub">(C)</span>' : "") + '</li>';
  const starters = (side.starters || []).length
    ? '<ul class="lineups-list">' + side.starters.map(li).join("") + '</ul>' : "";
  const subs = (side.subs || []).length
    ? '<div class="lineups-sub-title">控え選手</div><ul class="lineups-list lineups-bench">' +
        side.subs.map(li).join("") + '</ul>'
    : "";
  const coach = side.coach
    ? '<div class="lineups-sub-title">監督</div><div class="lineups-bench" style="font-size:12px">' +
        esc(side.coach) + '</div>'
    : "";
  return '<div class="lineups-col">' +
    '<div class="lineups-team">' + esc(teamName || side.teamName || "") + '</div>' +
    starters + subs + coach +
  '</div>';
}

/* JFATVの埋め込みはハイライトとは限らない(フル配信のアーカイブのこともある)ので、
   「ハイライト動画」と決め打ちせずページに書かれていたタイトルをそのまま見出しにする。 */
function cupVideoHtml(ev) {
  if (!ev || !ev.videoId) return "";
  const src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(ev.videoId);
  const title = ev.videoTitle || "試合映像";
  return '<div class="highlight-video"><h4 class="lineups-title">' + esc(title) +
    ' <span class="highlight-video-source">(JFATV)</span></h4>' +
    '<div class="highlight-video-frame"><iframe src="' + esc(src) + '" title="' + esc(title) + '" ' +
      'loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
      'allowfullscreen></iframe></div></div>';
}

function renderCupEventsPanel(ev, m, ownIdTeam) {
  const homeName = m.home.name, awayName = m.away.name;
  const items = [];
  for (const side of ["home", "away"]) {
    for (const g of (m.scorers && m.scorers[side]) || []) {
      items.push({ minute: g.minute, side: side, html: "⚽ " + esc(g.name || g.text) });
    }
  }
  if (ev) {
    for (const c of ev.cards || []) {
      // type="unknown" は「JFA側のアイコンが未知で黄/赤を断定できない」ケース。灰色で出す。
      const label = c.type === "yellow" ? "警告" : (c.type === "red" ? "退場" : "警告/退場(種別不明)");
      items.push({
        minute: c.minute, side: c.side,
        html: '<span class="card-dot ' + esc(c.type || "unknown") + '" title="' + esc(label) + '"></span> ' +
          (c.no ? '<span class="lineups-num">' + esc(c.no) + '</span>' : "") + esc(c.name),
      });
    }
    for (const s of ev.subs || []) {
      items.push({
        minute: s.minute, side: s.side,
        html: "IN " + esc(s.in ? s.in.name : "?") +
          ' <span class="events-sub">/ OUT ' + esc(s.out ? s.out.name : "?") + '</span>',
      });
    }
  }
  items.sort((a, b) => cupMinuteSortKey(a.minute) - cupMinuteSortKey(b.minute));

  const lineupsHtml = cupHasLineups(ev)
    ? '<div class="lineups"><h4 class="lineups-title">メンバー</h4><div class="lineups-grid">' +
        cupSidePlayersHtml(ev.lineups.home, homeName) + cupSidePlayersHtml(ev.lineups.away, awayName) +
      '</div></div>'
    : "";
  const videoHtml = cupVideoHtml(ev);
  if (!items.length && !lineupsHtml && !videoHtml) {
    return '<div class="events-panel"><p class="muted" style="margin:0">詳細データはまだありません。</p></div>';
  }

  const listHtml = items.length
    ? '<ul class="events-list">' + items.map(it => {
        const sideId = it.side === "home" ? m.home.idTeam : m.away.idTeam;
        return '<li class="events-row' + (ownIdTeam && sideId && sideId === ownIdTeam ? " me" : "") + '">' +
          '<span class="events-minute">' + esc(cupMinuteLabel(it.minute)) + '</span>' +
          '<span class="events-club">' + esc(it.side === "home" ? homeName : awayName) + '</span>' +
          '<span class="events-desc">' + it.html + '</span>' +
        '</li>';
      }).join("") + '</ul>'
    : "";
  const pdfHtml = (ev && ev.officialReportUrl)
    ? '<p class="promo-note"><a href="' + esc(ev.officialReportUrl) + '" target="_blank" rel="noopener">公式記録(PDF) ↗</a></p>'
    : "";
  return '<div class="events-panel">' + videoHtml + lineupsHtml + listHtml + pdfHtml + '</div>';
}

function cupTeamHtml(side, ownIdTeam, isAway) {
  const isMe = !!(side.idTeam && side.idTeam === ownIdTeam);
  const cls = "ec-team" + (isAway ? " away" : "") + (isMe ? " me" : "") + (side.idTeam ? " team-link" : "");
  const attr = side.idTeam ? ' data-idteam="' + esc(side.idTeam) + '"' : "";
  return '<span class="' + cls + '"' + attr + '>' +
    (side.idTeam ? teamSwatchHtml(side.idTeam) : "") + esc(side.name || "未定") +

function cupScoreHtml(m) {

  return '<div class="ec-scorewrap"><span class="ec-score">' + m.score.home + ' - ' + m.score.away + '</span>' +

function cupScorersHtml(m) {
  const home = (m.scorers && m.scorers.home) || [];
  const away = (m.scorers && m.scorers.away) || [];

  return '<div class="ec-scorers"><div>' + lines(home) + '</div><div>⚽</div>' +

function cupWhenText(m) {
  if (!m.kickoffTbd && m.kickoffJst) return fmtDate(m.kickoffJst, true);
  /* 第39弾: 終わった試合はキックオフ時刻を持たない。日程ページが試合前は時刻、試合後は
     結果に変わるので、消化後は時刻が取れなくなるため。日付は分かっているのでそこだけ出す。
     済んだ試合に「時刻未定」は合わないので、その注記は付けない。 */
  if (!m.kickoffTbd && m.date) return fmtDate(m.date + "T00:00", false);
  if (m.date) return fmtDate(m.date + "T00:00", false) + " 時刻未定";
  return "日程未定";
}

/* 第36弾: 天皇杯とルヴァンで、試合の識別子・試合詳細の出どころ・詳細パネルの描き方が違う。
   行の見た目は同じなので、その3点だけ差し替えられるようにした。
     天皇杯 : JFAの試合ページ由来 (matchNumber / emperorsCupEvents / renderCupEventsPanel)
     ルヴァン: jleague.jp由来でJ1〜J3と同じ形 (code / leagueCupEvents / renderMatchEventsPanel) */
const CUP_KINDS = {
  emperors: {
    label: "天皇杯",
    source: "JFA",
    data: () => state.emperorsCup,
    idOf: m => m.matchNumber,
    eventsOf: m => findCupEvents(m.matchNumber),
    /* 得点者は日程データ側(m.scorers)に入っている */
    goalCountOf: m => ((m.scorers && m.scorers.home) || []).length + ((m.scorers && m.scorers.away) || []).length,
    hasDetail: ev => !!(cupHasLineups(ev) || (ev.cards || []).length || (ev.subs || []).length || ev.videoId),
    videoOf: ev => ev && ev.videoId,
    panel: (ev, m, ownIdTeam) => renderCupEventsPanel(ev, m, ownIdTeam),
  },
  leaguecup: {
    label: "ルヴァン",
    source: "Jリーグ公式",
    data: () => state.leagueCup,
    idOf: m => m.code,
    eventsOf: m => findLeagueCupEvents(m.code),
    /* 得点者は試合詳細側(ev.goals)にしか無い。日程ページはスコアまでしか持たない */
    goalCountOf: () => 0,
    hasDetail: hasMatchEventDetail,
    videoOf: ev => ev && (ev.highlightVideoId || ev.daznVideoId),
    panel: (ev, m, ownIdTeam) => renderMatchEventsPanel(
      ev, m.home.idTeam, m.home.name, m.away.idTeam, m.away.name, ownIdTeam),
  },
};
function cupKind() { return CUP_KINDS[state.cupKind] || CUP_KINDS.emperors; }

function cupRowHtml(m, ownIdTeam, showRound, kind) {
  kind = kind || CUP_KINDS.emperors;
  const involvesMe = !!(ownIdTeam && (m.home.idTeam === ownIdTeam || m.away.idTeam === ownIdTeam));
  const venue = m.venueFull || m.venue;
  // フェーズ2: 詳細(メンバー/交代/カード/動画)か得点者が1件でもあれば、行タップで展開できるようにする
  const ev = kind.eventsOf(m);
  const hasEvents = !!(ev && kind.hasDetail(ev)) || kind.goalCountOf(m) > 0;
  const eventsKey = "cup:" + state.cupKind + ":" + kind.idOf(m);
  const isOpen = hasEvents && state.eventsOpen === eventsKey;
  const expandHtml = hasEvents ? '<span class="events-toggle' + (isOpen ? " open" : "") + '">▸</span>' : "";
  const videoMarkHtml = kind.videoOf(ev) ? '<span class="video-mark" title="ハイライト動画あり">🎥</span>' : "";
  const attrHtml = hasEvents ? ' data-eventsrow="' + esc(eventsKey) + '"' + ROW_A11Y_ATTR +
    /* 開閉状態は eventsKey から直に見る。展開フラグの変数名が箇所ごとに違う(isOpen/isEventsOpen)うえ、
       宣言順も揃っていないため、そこに依存しない形にする。 */
    (state.eventsOpen === eventsKey ? ' aria-expanded="true"' : ' aria-expanded="false"') : "";
  return '<div class="ec-row-wrap">' +
    '<div class="ec-row' + (involvesMe ? " me" : "") + (hasEvents ? " has-events" : "") + '"' + attrHtml + '>' +
      '<div class="ec-when">' +
        (showRound ? '<span class="ec-round-tag">' + esc(m.round) + '</span>' : "") +
        '<span>' + esc(cupWhenText(m)) + '</span>' +
        (m.matchPageUrl ? '<a class="ec-link" href="' + esc(m.matchPageUrl) + '" target="_blank" rel="noopener">公式 ↗</a>' : "") +
        videoMarkHtml + expandHtml +
      '</div>' +
      '<div class="ec-teams">' +
        cupTeamHtml(m.home, ownIdTeam, false) + cupScoreHtml(m) + cupTeamHtml(m.away, ownIdTeam, true) +
      '</div>' +

/* 第36弾: 大会切替(天皇杯/ルヴァン)。既存の .seg-toggle をそのまま流用する。 */

/* 天皇杯とルヴァンで共通。中身の違いは CUP_KINDS に寄せてある。 */
function renderCup(found) {

  if (!state.cupRound || rounds.indexOf(state.cupRound) < 0) state.cupRound = defaultCupRound(data, found);

function renderLeagueSegment(activeLeague) {

    '<button type="button" class="' + (lg === activeLeague ? "active" : "") + '" aria-current="' + (lg === activeLeague) + '" data-allleague="' + lg + '">' +

/* 暫定順位の注記。全体モードとクラブモードに一字一句コピーされていたので定数にした。 */
const PROVISIONAL_NOTE = "※ アプリから取得した最新結果を反映した暫定順位です(当該チーム間の比較までは行っていないため、公式の順位とは並びが異なることがあります)。";

/* 第38弾: 順位表は全体モードとクラブモードで2実装に分裂していた。列構成・凡例・「暫定」バッジ・
   注記文まで同一で、勝点バーはクラブモード側にだけ実装されていた。全体モード側には
   「maxPoints を計算したのに一度も使わない」死にコードが残っていた(移植の途中で止まった痕跡)。
   次に列を1つ足す人がどちらを直すべきか判断できないので、1本にまとめて差分だけ opts で渡す。 */
/* 第28弾: 自分の周辺だけに絞った行番号の配列を返す。絞れないときは null。

   昇格圏・降格圏の境界にあたる行は、範囲外でも必ず残す。
   「自分がいまどのゾーンから何ポイント離れているか」がこの表の存在理由なので、
   そこを省くと意味が半減する。

   境界の順位はハードコードせず resolveZones() の結果からだけ作る。
   こうしておくと「J3の降格圏は出さない」という既存の判断が、ここでも自動的に守られる。 */
function focusedRowIndices(table, ownIdTeam, around, zones) {
  const idx = table.findIndex(r => r.idTeam === ownIdTeam);
  if (idx < 0) return null;
  const want = around * 2 + 1;
  let to = Math.min(table.length, Math.max(0, idx - around) + want);
  const from = Math.max(0, to - want);   // 端では自分の側に寄せて行数を保つ
  const keep = new Set();
  for (let i = from; i < to; i++) keep.add(i);
  for (const z of zones) {
    const edge = Math.max.apply(null, z.ranks);   // そのゾーンの最下位が境界
    const j = table.findIndex(r => r.rank === edge);
    if (j >= 0) keep.add(j);
  }
  const sorted = Array.from(keep).sort((a, b) => a - b);
  /* 飛びが1行だけなら、その行を出してしまう。「2位 … 4位」と省略記号を挟むより、
     3位をそのまま見せるほうが短くて読みやすい。 */
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] - sorted[i - 1] === 2) keep.add(sorted[i] - 1);
  }
  return Array.from(keep).sort((a, b) => a - b);
}

/* シーズンの進行度。ホームの並び順と、序盤の注記の判定に使う。
   しきい値は「順位表がどれくらい信用できるか」の体感で決めている:
     early = 消化20%未満。順位より次戦・直近結果のほうが情報量がある(38節なら7節あたりまで)
     late  = 消化75%以上。残り試合が少なく、他会場の結果の重みが増す
   totalRounds が取れないリーグでは "mid" を返して現状の並びのままにする(安全側)。 */
function seasonStage(allMatches, rules) {
  const total = rules && rules.totalRounds;
  if (!total) return "mid";
  const range = computePlayedRange(allMatches);
  if (!range.max) return "early";
  const ratio = range.max / total;
  if (ratio < 0.20) return "early";
  if (ratio >= 0.75) return "late";
  return "mid";
}

function standingsSectionHtml(standings, master, opts) {
  const rules = master.promotionRules;
  const zones = resolveZones(rules);
  const ownIdTeam = opts.ownIdTeam || null;
  const provisional = !!opts.provisional;
  const rankHistory = opts.rankHistory;
  // 勝点バーの基準。首位の勝点を100%にする(0除算を避けるため下限1)
  const maxPoints = Math.max(1, ...standings.table.map(r => r.points || 0));

  /* 第28弾: opts.focus があるときは自分の周辺だけに絞る。列は減らさない。
     順位タブと同じ表がそのまま縮んで見えるほうが、別レイアウトを覚えるより読みやすく、
     第38弾で1本にまとめた意味も保てる。 */
  const table = standings.table;
  let indices = table.map((_, i) => i);
  if (opts.focus && opts.focus.idTeam) {
    const picked = focusedRowIndices(table, opts.focus.idTeam, opts.focus.around || 3, zones);
    if (picked) indices = picked;
  }

  const rows = indices.map((i, n) => {
    const r = table[i];
    // 連続していない箇所には省略行を挟む
    const gapHtml = (n > 0 && i !== indices[n - 1] + 1)
      ? '<tr class="st-gap"><td colspan="9">…</td></tr>' : "";
    const z = zoneColor(r.rank, rules);
    const form = (r.recent5 || []).map(x => '<span class="pill ' + x + '">' + x + '</span>').join("");
    const ptsPct = Math.round((r.points || 0) / maxPoints * 100);
    return gapHtml + '<tr class="' + (r.idTeam === ownIdTeam ? "me" : "") + '"' +
      ' style="background:linear-gradient(90deg, var(--pts-tint) ' + ptsPct + '%, transparent ' + ptsPct + '%)">' +
      '<td class="rank num">' + r.rank + rankDeltaHtml(rankHistory, r.idTeam, provisional) + '</td>' +
      '<td class="club">' +
        (z ? '<span class="zone" style="background:' + z.color + '"></span>' : '<span class="zone" style="background:transparent"></span>') +
        '<span class="team-link"' + LINK_A11Y_ATTR + ' data-idteam="' + esc(r.idTeam) + '">' + teamSwatchHtml(r.idTeam) + esc(r.short || r.ja) + '</span>' +
      '</td>' +
      '<td class="num">' + r.played + (r.playedDiff ? '<span class="diff">-' + r.playedDiff + '</span>' : '') + '</td>' +
      '<td class="num">' + r.win + '</td><td class="num">' + r.draw + '</td><td class="num">' + r.loss + '</td>' +
      '<td class="num">' + (r.gd > 0 ? "+" : "") + r.gd + '</td>' +
      '<td class="num"><b>' + r.points + '</b></td>' +
      '<td class="form"><span class="form-row">' + form + '</span></td>' +
    '</tr>';
  }).join("");

  const legend = zones.map(z => '<span><i class="sw" style="background:' + z.color + '"></i>' + esc(z.label) + '</span>');
  legend.push('<span><b style="color:var(--diff-ink)">-1</b> は消化試合が1つ少ないことを示します</span>');
  const badgeHtml = provisional ? '<span class="provisional-badge">暫定</span>' : "";
  const provisionalNoteHtml = provisional ? '<p class="ondemand-basis">' + PROVISIONAL_NOTE + '</p>' : "";

  return '<section><h2>' + esc(opts.heading) + badgeHtml + '</h2><div class="card">' +
    (opts.aboveTableHtml || "") +
    '<table><thead><tr>' +
      '<th class="rank">#</th><th class="club">クラブ</th><th>試</th><th>勝</th><th>分</th><th>負</th><th>差</th><th>点</th>' +
      '<th class="form">直近</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="legend">' + legend.join("") + '</div>' +
    provisionalNoteHtml +
  '</div></section>' + renderRankHistoryChart(rankHistory, master, ownIdTeam, opts.league);
}

function renderAllStandings(league, standings, found, provisional, rankHistory) {
  const master = state.masters[league];

  const heading = (master.meta && master.meta.leagueNameJa) || LEAGUES[league].name;
  if (!standings) {
    return '<section><h2>順位（全体）</h2><div class="card">' + segHtml +
      '<p class="muted" style="margin:10px 0 0">' + esc(heading) + 'の順位データがまだありません。</p></div></section>';
  }
