<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e60012">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOSはapple-touch-iconにSVGを受け付けない(ホーム画面のアイコンがページの縮小版になる)ので、
     ここだけは実寸のPNGを指す。生成は scripts/build_icons.py。 -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" id="faviconLink">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Jリーグ ダッシュボード</title>
<script>
/* テーマ(light/dark)の解決だけを、描画より前にここで行う。本体のJSに任せると、
   ダーク設定の端末で一瞬まぶしい白が見えてしまう。判定結果は data-theme 属性に入れ、
   CSSもJSもこの属性だけを見る。 */
(function(){
  try{
    var p = localStorage.getItem("jleague-app.theme") || "auto";
    var dark = p === "dark" ||
      (p === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }catch(e){ document.documentElement.setAttribute("data-theme", "light"); }
})();
</script>
<style>
  /* 面と文字の基本トークン。
     --card / --surface-* / --line / --accent* は applyTheme() が「クラブ色をわずかに帯びた値」で
     上書きする。ここに書いてあるのはJSが走る前と、色を持たないクラブのフォールバック。
     意味を持つ色(ライブ・暫定・エラー)と影はクラブ色に依存しないのでCSS側で持つ。 */
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#15181d; --sub:#6b7280; --line:#e3e6ea;
    --surface-1:#f7f8fa;   /* カード内で一段沈む面(タイル・チップ・詳細パネルの地) */
    --surface-2:#eceff3;   /* さらに沈む面(帯のトラック・サムネイルの下地) */
    --accent:#0b6b3a; --accent-sub:#0b6b3a; --accent-ink:#fff; --accent-sub-ink:#fff;
    --accent-on-light:#0b6b3a;  /* カード面の上で本文として読めるクラブ色(JSが生成) */
    --accent-grad-to:#0b6b3a;   /* ヘッダーのグラデーション終点(JSが生成) */
    --win:#1a7f45; --draw:#8a8f98; --loss:#c0392b;
    --promo:#1a7f45; --po:#d99e0b; --releg:#c0392b;
    --live-bg:#fff7f7; --live-line:#fca5a5; --live-row:#fff7ed; --live-ink:#c2410c;
    --warn-bg:#fef3c7; --warn-ink:#92400e;
    --err-bg:#fff2f0; --err-line:#f3c6c0; --err-ink:#8a2b20;
    --diff-ink:#b45309;
    --focus:#2563eb;
    --marker:#fff; --marker-line:#444;   /* 帯の上に置く目印(中央値・現在地) */
    --live-dot:#dc2626; --warn-dot:#d97706;
    --lg-j1:#c62828; --lg-j2:#2e7d32; --lg-j3:#1565c0;   /* リーグ識別バッジ */
    /* selectの矢印。data URIの中では変数が使えないので、テーマごとに画像ごと差し替える */
    --select-arrow:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b7280' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    --radius:16px;
    /* 影は3段だけ持つ。カード=1、その中間=2、浮くもの(ポップオーバー)=3。 */
    --elev-1:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
    --elev-2:0 4px 10px rgba(16,24,40,.08), 0 2px 4px rgba(16,24,40,.06);
    --elev-3:0 12px 28px rgba(16,24,40,.16), 0 4px 8px rgba(16,24,40,.08);
  }
  /* ダーク。data-theme は <head> の先頭で必ず設定される(OS設定 or 保存された選択)ので、
     ここで prefers-color-scheme を二重に見ない(見ると手動トグルが効かなくなる)。
     クラブ色に由来する面(--card, --surface-1, --surface-2, --line)は applyTheme() が
     上書きするため、
     ここではクラブ色と無関係なものだけを定義する。 */
  :root[data-theme="dark"]{
    --bg:#0e1116; --card:#171c24; --ink:#e7eaef; --sub:#9aa4b2; --line:#2a323d;
    --surface-1:#1c222b; --surface-2:#232a35;
    --win:#34d399; --draw:#9aa4b2; --loss:#f87171;
    --promo:#34d399; --po:#fbbf24; --releg:#f87171;
    --live-bg:#2a1417; --live-line:#7f1d1d; --live-row:#2a1a10; --live-ink:#fb923c;
    --warn-bg:#3a2c08; --warn-ink:#fcd34d;
    --err-bg:#2a1416; --err-line:#7f1d1d; --err-ink:#fca5a5;
    --diff-ink:#fbbf24;
    --focus:#60a5fa;
    --marker:#e7eaef; --marker-line:#0e1116;
    --pill-ink:#0e1116;   /* ダークの--win/--draw/--lossは明るい色なので、勝敗ピルの文字は暗くする */
    --live-dot:#f87171; --warn-dot:#fbbf24;
    --lg-j1:#ef5350; --lg-j2:#4caf50; --lg-j3:#42a5f5;
    --select-arrow:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%239aa4b2' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    /* 暗い地では黒い影が見えない。影は弱め、面の分離は境界線に寄せる。 */
    --elev-1:0 1px 2px rgba(0,0,0,.40);
    --elev-2:0 4px 12px rgba(0,0,0,.45);
    --elev-3:0 14px 32px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page-bg, var(--accent)); color:var(--ink); /* 地はベタ塗り(縦に長いのでグラデーションにしない) */
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;
    font-size:15px; line-height:1.55;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }

  /* ヘッダー+タブバーをまとめて上部固定 */
  #headerWrap{position:sticky; top:0; z-index:10}
  header{
    /* 1stカラーを地にしたまま、下端に向けてだけわずかに沈める。色が変わったと分かるほどの
       グラデーションにはしない(第29弾。それ以前は完全なベタ塗りだった)。 */
    background:linear-gradient(180deg, var(--accent) 0%, var(--accent-grad-to) 100%);
    color:var(--accent-ink);
    padding:12px calc(14px + env(safe-area-inset-right)) 12px calc(14px + env(safe-area-inset-left));
    box-shadow:var(--elev-2);
    position:relative; /* トースト/ポップオーバーをこの下端にオーバーレイ表示するための基準 */
  }
  /* ヘッダを役割で2段に分ける(第10弾改訂2): 上段=アプリ全体・データの状態、下段=表示対象の選択 */
  .header-row1{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
  /* h1はflexアイテムとして縮む対象になる。右側のボタン群(⟳/i/deployBadge)で幅が圧迫されると、
     white-spaceの指定が無いと日本語は任意の位置で改行できるため1文字ずつ縦に積まれてしまう。
     flex:1 1 auto + min-width:0 + white-space:nowrap + overflow:hidden の4点セットで
     「入らなければ末尾を…で省略」という単一行の挙動にする(改訂: fix-header-layout)。 */
  header h1{
    margin:0; font-size:15px; font-weight:600; letter-spacing:.04em; opacity:.9;
    flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-row1-right{display:flex; align-items:center; gap:6px; flex:none}
  /* デプロイ日時・バージョンのデバッグ表示。目立たせない(色はh1と同じaccent-ink継承、不透明度だけ落とす)。
     狭い画面では優先度が低いので隠す(更新ボタンは常に出す)。 */
  .deploy-badge{font-size:9px; opacity:.55; letter-spacing:.02em; white-space:nowrap}
  @media (max-width:360px){ .deploy-badge{display:none} header h1{font-size:13px} }
  .header-row2{display:flex; gap:8px; align-items:center}
  .header-row2 select{flex:1; min-width:0; padding:8px 12px} /* 本文中の汎用select{padding:10px 12px}をヘッダ内だけ上書き */
  /* モード切替(クラブ/全体)。タブバーと同じ2ndカラーのベタ塗りの上に、さらに一段浮かせた見た目にする */
  .mode-toggle{display:flex; gap:6px; flex:none; width:120px}
  .mode-toggle button{
    flex:1; border:1px solid var(--on-accent-line); background:var(--on-accent-soft);
    color:var(--accent-ink); opacity:.75; font-size:12px; font-weight:700; padding:7px 4px;
    border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .mode-toggle button.active{background:var(--card); color:var(--accent-on-light); opacity:1; border-color:var(--card)}
  @media (max-width:360px){ .mode-toggle{width:96px} .mode-toggle button{font-size:11px; padding:7px 2px} }

  #tabbar{
    display:flex; background:var(--accent-sub); /* 2ndカラーのベタ塗り */
    box-shadow:var(--elev-1);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  }
  #tabbar button{
    flex:1; border:none; background:none; padding:12px 3px 10px;
    font-size:12px; font-weight:700; color:var(--accent-sub-ink); opacity:.7;
    font-family:inherit; cursor:pointer;
    border-bottom:3px solid transparent;
  }
  /* 第32弾でタブが7個になった。390px幅だと1つあたり約56pxしか無く、12pxのままでは
     「スタッツ」「ニュース」が2行に折り返して他のタブと高さが揃わなくなる。
     タブを減らすかスクロールさせるかではなく、狭い端末で文字を1段落とす方を選んだ
     (全部のタブが常に見えている方が、この画面では迷わない)。
     幅を変えて確認済み: 320 / 360 / 390 / 430px のいずれでも1行に収まる。 */
  @media (max-width:420px){ #tabbar button{font-size:11px} }
  @media (max-width:344px){ #tabbar button{font-size:10px; padding-left:2px; padding-right:2px} }
  /* 選択中のタブは下線だけでなく面もわずかに持ち上げる。半透明の向き(白/黒)はタブバーの
     地色に載る文字色と揃えてあるので、明るい2ndカラーでも消えない。 */
  #tabbar button.active{opacity:1; border-bottom-color:var(--accent-sub-ink); background:var(--on-sub-soft)}
  select{
    width:100%; padding:10px 12px; font-size:16px; font-weight:600;
    border:none; border-radius:12px; background:var(--card); color:var(--ink);
    -webkit-appearance:none; appearance:none;
    background-image:var(--select-arrow);
    background-repeat:no-repeat; background-position:right 14px center;
  }
  main{padding:16px calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left)); max-width:640px; margin:0 auto}
  section{margin-bottom:22px}
  h2{
    /* 背景(1stカラー)の上に直接載るので、輝度反転させたaccent-inkを使う(var(--sub)だと濃紺クラブ等で読めない) */
    font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--page-ink, var(--accent-ink));
    margin:0 0 9px 2px;
    display:flex; align-items:center; gap:7px;
  }
  /* 見出しの始点を示す短いバー。カードの外(クラブ色の地)に置かれた見出しを、
     小さな文字の列だけで終わらせないための最小限の装飾。 */
  h2::before{
    content:""; width:3px; height:13px; border-radius:2px; flex:none;
    background:var(--page-ink, var(--accent-ink)); opacity:.5;
  }
  .card{
    position:relative;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:17px 16px 16px;
    box-shadow:var(--elev-1);
  }
  /* カード上端のクラブカラーの帯。枠全体を2pxのクラブ色で囲うと色の濃いクラブで画面が
     うるさくなるので、主張を1辺に集約する。1st→2ndの並びにすればクラブの2色が両方出る。
     overflow:hiddenを使わず角丸だけ合わせているのは、カードから意図的にはみ出す要素
     (自クラブ行の margin:0 -6px など)を切り落とさないため。 */
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    border-radius:var(--radius) var(--radius) 0 0;
    background:linear-gradient(90deg, var(--bar-a, var(--accent)) 0%, var(--bar-b, var(--accent-sub)) 100%);
  }
  .muted{color:var(--sub)}
  .small{font-size:12px}

  /* 次戦 */
  .next-meta{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub); margin-bottom:10px}
  .tag{
    display:inline-block; padding:2px 8px; border-radius:999px;
    font-size:11px; font-weight:700; letter-spacing:.04em;
  }
  .tag.home{background:var(--accent); color:var(--accent-ink)}
  .tag.away{background:var(--surface-2); color:var(--sub)}
  .next-date{font-size:22px; font-weight:700; letter-spacing:.01em}
  .next-opp{font-size:17px; font-weight:600; margin-top:4px}
  .next-venue{font-size:13px; color:var(--sub); margin-top:6px}

  /* クラブのバッジ。実物のエンブレムは使えないので、クラブの2色を斜めに分けた円と
     短縮名の頭文字で代用する。斜めの分割線はユニフォームの配色を連想させるための形。 */
  .crest{
    display:inline-flex; align-items:center; justify-content:center;
    width:52px; height:52px; border-radius:50%; flex:none;
    font-size:21px; font-weight:800; line-height:1;
    box-shadow:var(--elev-1), inset 0 0 0 2px rgba(255,255,255,.22);
  }
  .crest.sm{width:34px; height:34px; font-size:14px; box-shadow:none; inset:0}

  /* 次の試合(対戦カード) */
  .vs-teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:10px; margin:16px 0 14px}
  .vs-side{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0}
  .vs-name{
    font-size:13px; font-weight:600; text-align:center; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .vs-side.me .vs-name{font-weight:800}
  .vs-mid{flex:none; text-align:center; padding-top:6px}
  /* カード内で一番大きい数字。ここが画面の主役になる。 */
  .vs-kick{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05; letter-spacing:-.01em}
  .vs-kick.tbd{font-size:19px}
  .vs-date{font-size:12px; color:var(--sub); margin-top:4px; white-space:nowrap}
  .vs-venue{text-align:center; font-size:12px; color:var(--sub)}
  .vs-note{text-align:center; font-size:12px; color:var(--sub); margin-top:4px}

  /* 直近結果 */
  ul.results{list-style:none; margin:0; padding:0}
  /* 第14弾: 試合ドリルダウン対応のため、grid行(.r-row)と詳細パネルをliの中で縦に並べる */
  .r-row{
    display:grid; grid-template-columns:auto 26px 1fr auto auto 14px;
    align-items:center; gap:10px;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  ul.results li:last-child .r-row{border-bottom:none}
  .r-date{font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap}
  .r-ha{font-size:11px; font-weight:700; color:var(--sub); text-align:center}
  .r-opp{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .r-score{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.02em}
  .pill{
    width:20px; height:20px; border-radius:6px; color:var(--pill-ink,#fff);
    font-size:11px; font-weight:700; line-height:20px; text-align:center; flex:none;
  }
  .pill.W{background:var(--win)} .pill.D{background:var(--draw)} .pill.L{background:var(--loss)}

  /* 日程 */
  .schedule-controls{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
  .seg-toggle{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex:none}
  .seg-toggle button{
    border:none; background:var(--card); color:var(--sub); font-size:12px; font-weight:700;
    padding:8px 12px; cursor:pointer; font-family:inherit;
  }
  .seg-toggle button.active{background:var(--accent); color:var(--accent-ink)}
  /* font-sizeは16px未満にしないこと(iOS Safariがフォーカス時に自動ズームし、自動で戻らない)。
     見た目を詰めたい場合はpaddingで調整する。 */
  .schedule-controls select{width:auto; flex:1; min-width:110px; padding:8px 10px; font-size:16px; font-weight:600}
  .sched-round{margin-top:18px; scroll-margin-top:90px}
  .sched-round:first-child{margin-top:0}
  .sched-round-title{font-size:11px; font-weight:700; color:var(--sub); margin:0 0 6px 2px}
  .sched-row{
    display:grid; grid-template-columns:26px 1fr auto 14px; align-items:center; gap:8px;
    padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .sched-row.all{grid-template-columns:1fr auto 1fr 14px}
  .sched-row.all .sched-team.away{text-align:right}
  /* 第13弾でsched-rowを.sched-row-wrapに包んだため、:last-childは1つ外側で判定する */
  .sched-row-wrap:last-child .sched-row{border-bottom:none}
  /* 自クラブが絡む行(「リーグ全体」トグル時)は順位表の自クラブ行と同じ考え方で淡く強調する */
  .sched-row.me{background:var(--me-bg,#eaf6ef); margin:0 -6px; padding-left:6px; padding-right:6px; border-radius:6px}
  .sched-ha{font-size:11px; font-weight:700; color:var(--sub); text-align:center}
  .sched-score{
    font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:flex-end; gap:6px;
  }

  /* 順位表 */
  table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
  th,td{padding:7px 3px; text-align:right; font-size:13px; border-bottom:1px solid var(--line)}
  th{font-size:10px; color:var(--sub); font-weight:600; letter-spacing:.04em; border-bottom-width:2px}
  td.rank,th.rank{text-align:center; width:30px; font-weight:600}
  /* 前節からの順位変動。順位表はrankHistoryを引数で受け取っていたのに使っていなかった
     (推移グラフに丸投げしていた)ので、一番動きの分かる情報を表の中に出す。 */
  .rk-delta{display:block; font-size:9px; font-weight:700; line-height:1.2; margin-top:1px}
  .rk-delta.up{color:var(--win)}
  .rk-delta.down{color:var(--loss)}
  .rk-delta.same{color:var(--sub); opacity:.55}
  /* 勝点は行の背景を伸びる帯で見せる(インラインstyleで幅を指定)。
     セル内の細い線だと列幅が20px程度しかなく、勝点の開きが伝わらないため。
     自クラブの行は tr.me td の背景が前に来るので帯は見えない(そちらの強調を優先する)。 */
  td.club,th.club{text-align:left; padding-left:6px}
  td.form,th.form{text-align:left; padding-left:8px}
  tr.me td{background:var(--me-bg,#eaf6ef); font-weight:700}
  tr.me td.club{box-shadow:inset 3px 0 0 var(--me-accent,var(--accent))}
  .zone{display:inline-block; width:5px; height:18px; border-radius:3px; vertical-align:-4px; margin-right:6px}
  .diff{font-size:10px; color:var(--diff-ink); margin-left:3px; font-weight:600}
  .form-row{display:flex; gap:3px}
  .form-row .pill{width:16px; height:16px; line-height:16px; font-size:9px; border-radius:4px}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:11px; color:var(--sub)}
  .legend span{display:flex; align-items:center; gap:5px}
  .sw{width:10px; height:10px; border-radius:3px; display:inline-block}
  /* 第14弾: 試合行・カード内のチーム名の前に置く、チームカラーの小さな四角(フラッグ代わり) */
  .team-sw{width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:middle; flex:none}

  a.btn{
    display:block; text-align:center; text-decoration:none;
    background:var(--card); color:var(--accent-on-light); font-weight:700; font-size:14px;
    padding:14px; border-radius:var(--radius); border:1px solid var(--line);
  }
  footer{text-align:center; font-size:11px; color:var(--page-ink, var(--accent-ink)); margin-top:24px; padding:0 16px}
  .err{background:var(--err-bg); border:1px solid var(--err-line); color:var(--err-ink); padding:14px; border-radius:var(--radius); font-size:13px}

  /* 昇格確率 */
  .promo-grid{display:flex; gap:10px}
  .promo-cell{flex:1; text-align:center; padding:14px 4px 12px; border-radius:12px; background:var(--surface-1)}
  /* 確率はリング(ドーナツ)で出す。数字だけを並べるより、3つのゾーンの大小が一目で比べられる。 */
  .promo-ring{position:relative; width:64px; height:64px; margin:0 auto 7px}
  .promo-ring svg{display:block}
  .promo-num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  }
  .promo-label{font-size:11px; color:var(--sub)}
  .promo-auto{color:var(--promo)} .promo-po{color:var(--po)} .promo-releg{color:var(--releg)}
  .promo-note{margin:10px 0 0; font-size:12px; color:var(--sub)}
  /* 消化試合が少ない序盤に、注記を目立たせる(赤系は使わない) */
  .promo-note-emphasis{
    margin:10px 0 0; padding:10px 12px; border-radius:10px;
    background:var(--surface-1); font-size:12px; font-weight:700; color:var(--ink);
  }
  /* 予想順位(最頻値)ブロック。確率タイルと同じカード内の別セクションとして下に積む */
  .mode-rank{margin-top:14px; padding-top:14px; border-top:1px solid var(--line); text-align:center}
  .mode-rank:first-child{margin-top:0; padding-top:0; border-top:none}
  .mode-rank-label{font-size:11px; color:var(--sub)}
  .mode-rank-num{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px}
  .mode-rank-sub{font-size:12px; color:var(--sub); margin-top:4px}
  .mode-rank-warn{font-size:12px; font-weight:700; color:var(--ink); margin-top:4px}

  /* ニュース */
  ul.news-list{list-style:none; margin:0; padding:0}
  ul.news-list li.news-item{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line)}
  ul.news-list li.news-item:last-child{border-bottom:none}
  .news-thumb{width:72px; height:72px; flex:none; border-radius:8px; object-fit:cover; background:var(--surface-2)}
  .news-item-body{min-width:0; flex:1}
  .news-item a{color:var(--ink); text-decoration:none; font-size:14px; font-weight:600; display:block}
  .news-item a:hover{text-decoration:underline}
  .news-meta{font-size:11px; color:var(--sub); margin-top:3px}
  .news-ob{margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
  .news-ob-name{font-size:13px; font-weight:700; margin:0 0 6px}

  /* スタッツ */
  .stats-subtabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
  .stats-subtabs button{
    flex:1; min-width:70px; border:1px solid var(--line); background:var(--surface-1); color:var(--sub);
    font-size:12px; font-weight:700; padding:8px 4px; border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .stats-subtabs button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .stat-group{margin-top:16px}
  .stat-group:first-child{margin-top:0}
  .stat-group-title{font-size:11px; font-weight:700; color:var(--sub); margin:0 0 4px 2px}
  td.stat-rank-top{color:var(--accent-on-light); font-weight:700}

  /* 今季の主役 / 選手一覧 */
  td.p-name,th.p-name{text-align:left; padding-left:6px}
  /* 年齢は生年月日と同じセルに縦に積む。横に並べると狭い端末で選手名の幅を食うため。 */
  td.p-age{white-space:nowrap; font-variant-numeric:tabular-nums}
  .p-bd{display:block; font-size:10px; font-weight:400; color:var(--sub)}
  .leaders{display:flex; flex-direction:column; gap:8px}
  .leader-row{display:flex; align-items:baseline; gap:8px; font-size:13px}
  .leader-cat{color:var(--sub); font-size:11px; width:76px; flex:none}
  .leader-name{flex:1; font-weight:600}
  .leader-name a{color:var(--ink); text-decoration:none}
  .leader-name a:hover{text-decoration:underline}
  .leader-val{font-weight:700; font-variant-numeric:tabular-nums}
  td.p-name a{color:var(--ink); text-decoration:none}
  td.p-name a:hover{text-decoration:underline}

  /* シーズン別成績 */
  details > summary{cursor:pointer; font-size:13px; font-weight:600; color:var(--accent-on-light); padding:2px 0}
  details[open] > summary{margin-bottom:10px}

  /* クリックでクラブ切替できる要素(タップ可能に見せる: 下線+シェブロン) */
  .team-link{
    text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--sub);
    text-underline-offset:2px; cursor:pointer;
  }
  .team-link::after{content:" \203A"; color:var(--sub); text-decoration:none}

  /* レーダーチャート */
  .radar-wrap{display:flex; justify-content:center}
  .radar-label-name{font-size:10px; font-weight:700; fill:var(--ink)}
  .radar-label-rank{font-size:9px; fill:var(--sub)}
  .radar-hit{cursor:pointer}
  #radarTooltip{
    margin-top:8px; min-height:18px; text-align:center;
    font-size:12px; font-weight:600; color:var(--ink);
  }
  .radar-limit-note{margin:10px 0 0; font-size:11px; color:var(--sub); line-height:1.5}

  /* 確率推移グラフ(第8弾A) */
  .chart-series-tabs{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}
  .chart-series-tabs button{
    flex:1; min-width:70px; border:1px solid var(--line); background:var(--surface-1); color:var(--sub);
    font-size:12px; font-weight:700; padding:8px 4px; border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .chart-series-tabs button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .chart-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
  .chart-chip{
    border:1px solid var(--line); background:var(--card); color:var(--sub); font-size:11px; font-weight:700;
    padding:6px 10px; border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .chart-chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  /* 第32弾: マイニュース */
  .mynews-form{display:flex; gap:8px; align-items:stretch; margin:0 0 10px}
  .mynews-form input{flex:1; min-width:0}
  .mynews-form button{flex:none; padding:0 16px; min-height:44px; border-radius:var(--radius);
    border:none; background:var(--accent); color:var(--accent-ink); font-family:inherit; font-size:13px; font-weight:700}
  .mynews-chips{display:flex; flex-wrap:wrap; gap:6px}
  .mynews-chip{display:inline-flex; align-items:center; gap:6px; padding:0 4px 0 10px; min-height:36px;
    border:1px solid var(--line); border-radius:999px; background:var(--surface-1); font-size:12px; font-weight:700}
  .mynews-chip .mynews-count{color:var(--sub); font-weight:700; font-variant-numeric:tabular-nums}
  .mynews-chip .mynews-count.zero{opacity:.6}
  /* ✕は見た目26pxのまま、当たり判定だけ広げる(ヘッダーのボタンと同じ考え方)。 */
  .mynews-chip button{position:relative; width:26px; height:26px; border:none; border-radius:50%;
    background:none; color:var(--sub); font-family:inherit; font-size:13px; line-height:1; cursor:pointer}
  .mynews-chip button::after{content:""; position:absolute; top:50%; left:50%; width:44px; height:44px; transform:translate(-50%,-50%)}
  /* 見出しの中でヒットした語。クラブ色(--accent/--accent-sub)を地色に使うと、
     ダークモードでカードの地色との差が1.26:1しか無く、ほとんど見えなかった(実測)。
     文字色と地色をそのまま入れ替える。--ink と --card は必ず対になっているので、
     ライトでもダークでも、どのクラブ色でも確実に浮き上がる。 */
  .news-item mark{background:var(--ink); color:var(--card); border-radius:3px; padding:0 3px; font-weight:800}
  .chart-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .chart-scroll svg{display:block}
  .chart-axis-label{font-size:9px; fill:var(--sub)}
  .chart-result-mark{font-size:11px; font-weight:700; fill:var(--ink)}
  .rank-team-label{cursor:pointer}
  .rank-team-label text{font-size:18px}
  .rank-value-label{font-size:9px; font-weight:700}
  .rank-chart-wrap svg{display:block; width:100%; height:auto}

  /* 他会場インパクト(第8弾B) */
  .impact-own{padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--line)}
  .impact-own-vals{font-size:14px; font-weight:700; margin-top:4px}
  .impact-row{padding:8px 0; border-bottom:1px solid var(--line); font-size:13px}
  .impact-row:last-child{border-bottom:none}
  .impact-row-title{font-size:11px; color:var(--sub)}
  .impact-row-vals{margin-top:2px; font-weight:600}

  /* カレンダー配信(第8弾C) */
  .ics-block{margin-bottom:16px}
  .ics-block .btn{margin-bottom:8px}
  .btn-secondary{
    display:block; width:100%; text-align:center; background:none; border:1px solid var(--line);
    color:var(--sub); font-weight:700; font-size:13px; padding:10px; border-radius:var(--radius);
    cursor:pointer; font-family:inherit; margin-bottom:8px;
  }

  /* 全体ビュー(第9弾) 共通: リーグセグメント切替はscheduleの.seg-toggleを再利用する */
  .league-badge{
    display:inline-block; font-size:9px; font-weight:700; padding:2px 5px; border-radius:4px;
    color:#fff; letter-spacing:.02em; flex:none;
  }
  .league-badge.j1{background:var(--lg-j1)} .league-badge.j2{background:var(--lg-j2)} .league-badge.j3{background:var(--lg-j3)}

  /* 全体モード: 日程タブ(日付軸) */
  .cal-league-filter{display:flex; gap:6px; margin-bottom:14px}
  .cal-league-filter button{
    flex:1; border:1px solid var(--line); background:var(--surface-1); color:var(--sub);
    font-size:12px; font-weight:700; padding:8px 4px; border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .cal-league-filter button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .cal-day{margin-top:16px}
  .cal-day:first-child{margin-top:0}
  .cal-day-title{font-size:11px; font-weight:700; color:var(--sub); margin:0 0 6px 2px}
  .cal-row{
    display:grid; grid-template-columns:26px 38px 1fr auto 1fr 24px 14px; align-items:center; gap:6px;
    padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  /* 第13弾でcal-rowを.cal-row-wrapに包んだため、:last-childは1つ外側で判定する */
  .cal-row-wrap:last-child .cal-row{border-bottom:none}
  .cal-row.me{background:var(--me-bg,#eaf6ef); margin:0 -6px; padding-left:6px; padding-right:6px; border-radius:6px; box-shadow:inset 3px 0 0 var(--me-accent, var(--accent))}
  .cal-time{font-size:11px; color:var(--sub); text-align:right; font-variant-numeric:tabular-nums}
  .cal-team{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px}
  .cal-team.away{text-align:right}
  .cal-score{font-weight:700; font-variant-numeric:tabular-nums; text-align:center; white-space:nowrap; display:inline-flex; align-items:center; gap:4px}
  .cal-round{font-size:9px; color:var(--sub); text-align:right}
  /* 第23弾: 天皇杯(出典はJFA)。既存の.cal-*とはグリッドの列構成が違うので別クラスにしてある */
  /* 第36弾: 見出しの直後に置く前提の -4px だったが、大会切替(.seg-toggle)を挟むように
     なって切替ボタンと詰まって見えた。セグメントの直後に来る場合だけ上を空ける。 */
  .ec-comp{font-size:11px; color:var(--sub); margin:-4px 2px 8px}
  .seg-toggle + .ec-comp{margin-top:8px}
  .ec-sub{font-size:12px; font-weight:700; margin:0 0 8px; color:var(--sub)}
  .ec-row{padding:9px 0; border-bottom:1px solid var(--line)}
  .ec-row-wrap:last-child .ec-row{border-bottom:none}
  .ec-row.has-events{cursor:pointer}
  .ec-row.me{background:var(--me-bg,#eaf6ef); margin:0 -6px; padding:9px 6px; border-radius:6px; box-shadow:inset 3px 0 0 var(--me-accent, var(--accent))}
  .ec-when{font-size:11px; color:var(--sub); display:flex; gap:8px; align-items:center}
  .ec-round-tag{font-weight:700}
  .ec-link{margin-left:auto; font-size:11px; color:var(--sub); flex:0 0 auto}
  .ec-teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-top:4px}
  .ec-team{font-size:13px; overflow:hidden; text-overflow:ellipsis}
  .ec-team.away{text-align:right}
  .ec-team.team-link{cursor:pointer}
  .ec-team.me{font-weight:700}
  .ec-qual{display:block; font-size:10px; color:var(--sub); font-weight:400}
  .ec-scorewrap{text-align:center; white-space:nowrap}
  .ec-score{font-weight:700; font-variant-numeric:tabular-nums}
  .ec-ex,.ec-pk{display:block; font-size:9px; color:var(--sub); font-weight:700}
  .ec-venue{font-size:11px; color:var(--sub); margin-top:3px}
  .ec-scorers{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; margin-top:4px; font-size:11px; color:var(--sub); line-height:1.5}
  .ec-scorers .away{text-align:right}
  .ec-rounds{display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:8px; -webkit-overflow-scrolling:touch}
  .ec-rounds button{
    flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--sub); white-space:nowrap;
    font-size:12px; font-weight:700; padding:7px 12px; border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .ec-rounds button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .cal-loadmore{
    display:block; width:100%; margin:14px 0; padding:10px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--card); color:var(--sub); font-weight:700; font-size:13px;
    cursor:pointer; font-family:inherit;
  }

  /* 全体モード: 予想タブ(B案: 帯+タップ詳細) */
  .predict-legend{display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--sub); margin-bottom:10px}
  .predict-row{display:grid; grid-template-columns:20px 44px 1fr 32px; align-items:center; gap:8px; padding:5px 0; cursor:pointer}
  .predict-row.me{background:var(--me-bg,#eaf6ef); margin:0 -6px; padding-left:6px; padding-right:6px; border-radius:6px}
  .predict-rk{font-size:11px; color:var(--sub); text-align:right; font-variant-numeric:tabular-nums}
  .predict-nm{font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .predict-pt{font-size:11px; color:var(--sub); text-align:right; font-variant-numeric:tabular-nums}
  .predict-track{position:relative; height:20px; background:var(--surface-2); border-radius:5px; overflow:hidden}
  .predict-band-zone{position:absolute; top:0; bottom:0; opacity:.28}
  .predict-band{position:absolute; top:3px; bottom:3px; border-radius:4px; opacity:.92; box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
  .predict-med{position:absolute; top:2px; bottom:2px; width:2px; background:var(--marker); opacity:.9; border-radius:1px}
  .predict-cur{
    position:absolute; top:50%; width:8px; height:8px; margin-top:-4px; margin-left:-4px;
    border-radius:50%; background:var(--marker); border:2px solid var(--marker-line); opacity:.95;
  }
  /* margin左80px/右40pxは .predict-row の grid-template-columns(20px 44px 1fr 32px)と gap(8px)から来ている: 左=20+8+44+8, 右=32+8。列幅を変えたらここも直すこと。 */
  .predict-axis{display:flex; justify-content:space-between; font-size:10px; color:var(--sub); margin:4px 40px 0 80px}
  .predict-detail{margin:2px 0 8px; padding:10px 12px; background:var(--surface-1); border-left:3px solid var(--accent); border-radius:0 8px 8px 0}
  .predict-detail-big{font-size:13px; margin-bottom:6px}
  .predict-detail-big b{font-size:19px}
  .predict-detail-kv{display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--sub)}
  .predict-detail-kv b{color:var(--ink); font-weight:700}

  /* オンデマンド更新(第10弾改訂2): ヘッダのボタン・トースト・ポップオーバー。
     ボタンをclubSelectから物理的に離しdeployBadgeの隣(アプリ全体の情報の並び)に置くことで、
     クラブ単位の操作ではなくJ1〜J3横断の操作であることを位置で伝える。 */
  .ondemand-header-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:3px;
    min-height:44px; min-width:44px; padding:0 10px; box-sizing:border-box;
    border:1px solid var(--on-accent-line); background:var(--on-accent-soft);
    color:var(--accent-ink); font-size:12px; font-weight:700; letter-spacing:.02em;
    border-radius:999px; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .ondemand-header-btn:disabled{opacity:.55; cursor:default}
  .ondemand-header-btn .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%; background:#fbbf24; margin-left:1px;
  }
  .ondemand-info-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; flex:none; border-radius:50%; border:1px solid var(--on-accent-line);
    background:var(--on-accent-soft); color:var(--accent-ink); font-size:11px; font-weight:700;
    font-style:italic; cursor:pointer; font-family:inherit; opacity:.85;
  }
  /* 表示テーマ(ライト/ダーク)の切替。iボタンと同じ大きさ・同じ質感で隣に並べる。
     見た目は26pxのままで、当たり判定だけ44pxに広げる(第24弾と同じ手法・下で指定)。 */
  .theme-toggle-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; flex:none; border-radius:50%; border:1px solid var(--on-accent-line);
    background:var(--on-accent-soft); color:var(--accent-ink);
    cursor:pointer; font-family:inherit; opacity:.85; padding:0;
  }
  .theme-toggle-btn svg{display:block}
  /* headerの通常フローに置くと、表示/非表示のたびにヘッダの高さが変わり下のコンテンツが飛ぶ
     (stickyヘッダなので特に目立つ)。header{position:relative}を基準にオーバーレイ表示する
     (改訂: fix-header-layout)。#headerWrapのposition/z-indexはタブバー固定に関わるため触らない。 */
  .ondemand-toast{
    position:absolute; top:100%; left:calc(12px + env(safe-area-inset-left)); right:calc(12px + env(safe-area-inset-right)); z-index:20;
    margin:6px 0 0; padding:8px 12px; border-radius:10px; background:rgba(0,0,0,.28);
    color:var(--accent-ink); font-size:12px; font-weight:600; text-align:center;
  }
  /* 第30弾: 新しいデプロイを検知したときのバナー。トーストと違って自分では消えない。
     3.5秒で消えると、見逃した利用者が古い画面のまま使い続けることになるため。
     消えないからこそ、トースト(.ondemand-toast)のような position:absolute の重ね置きにはしない。
     出しっぱなしのオーバーレイはタブバーを覆い隠してしまう(実機確認で判明)。
     ヘッダーの中に普通に流し込んで、その間だけヘッダーが1行ぶん高くなるようにする。 */
  .update-banner{
    margin:6px 0 0; padding:6px 12px; border-radius:10px; background:rgba(0,0,0,.34);
    color:var(--accent-ink); font-size:12px; font-weight:600;
    display:flex; gap:10px; align-items:center; justify-content:center;
  }
  /* display:flex は [hidden] のUAスタイル(display:none)より詳細度が高いので、
     これが無いと hidden を付けても出っぱなしになる。消し忘れ厳禁。 */
  .update-banner[hidden]{display:none}
  .update-banner button{
    padding:0 14px; border-radius:999px; border:1px solid currentColor;
    background:transparent; color:inherit; font-size:12px; font-weight:700;
  }
  .ondemand-popover{
    position:absolute; top:100%; left:calc(12px + env(safe-area-inset-left)); right:calc(12px + env(safe-area-inset-right)); z-index:20;
    margin:6px 0 0; padding:12px 14px; border-radius:var(--radius); background:var(--card); color:var(--ink);
    box-shadow:0 4px 16px rgba(0,0,0,.18); font-size:12px;
  }
  .ondemand-popover h4{margin:0 0 8px; font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.06em}
  .ondemand-popover-row{display:flex; justify-content:space-between; gap:10px; padding:4px 0}
  .ondemand-popover-label{color:var(--sub); flex:none}
  .ondemand-popover-val{text-align:right}
  .ondemand-popover-hint{margin:8px 0 0; padding-top:8px; border-top:1px solid var(--line); font-size:11px; color:var(--sub); line-height:1.5}
  /* 第31弾: ポップオーバー内の設定。文字リンク風のボタンは見た目を小さくする代わりに、
     上下のpaddingで当たり判定だけ確保する(marginで相殺して行の高さは変えない)。 */
  .linklike{
    border:none; background:none; padding:8px 4px; margin:-8px 0;

    flex:1; min-width:0; font-size:16px; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; background:var(--surface-1); color:var(--ink); font-family:inherit;
  }
  .ghtoken-form button{
    flex:none; min-height:40px; border:1px solid var(--line); background:var(--surface-1);
    color:var(--ink); font-size:12px; font-weight:700; padding:8px 12px; border-radius:8px;
    cursor:pointer; font-family:inherit;

  /* ホームタブの昇格確率タイルだけは、その場に小さく基準時刻を残す(一番誤解されやすい数字のため) */
  .ondemand-basis-compact{margin:8px 0 0; font-size:11px; color:var(--sub)}
  /* 暫定(オンデマンド由来)であることの視覚区別。赤系(エラーと紛らわしい)は使わず琥珀系にする */
  .provisional-badge{
    display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px;
    background:var(--warn-bg); color:var(--warn-ink); margin-left:6px; vertical-align:2px; letter-spacing:0; text-transform:none;
  }
  .provisional-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--warn-dot);
    margin-left:4px; vertical-align:2px; flex:none;
  }
  .ondemand-basis{margin:10px 0 0; font-size:11px; color:var(--warn-ink); background:var(--warn-bg); padding:8px 10px; border-radius:8px}

  /* 第12弾: ライブスコア。動きのある要素(点滅ドット)で「更新され続けている」ことを示す。
     確定表示(通常のスコア)とは色を変え、進行中であることを一目で区別できるようにする。 */
  .live-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--live-dot);
    margin-left:4px; vertical-align:2px; flex:none; animation:live-pulse 1.4s ease-in-out infinite;
  }
  @keyframes live-pulse{0%,100%{opacity:1} 50%{opacity:.25}}
  .live-card{border:1px solid var(--live-line); background:var(--live-bg)}
  .live-card::before{background:var(--live-ink)}  /* 進行中のカードだけ帯を試合中の色にする */
  .live-score-row{
    display:flex; align-items:center; justify-content:center; gap:14px;
    font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;
  }
  .live-team{font-size:13px; font-weight:700; max-width:36%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--sub)}
  .live-team.me{color:var(--ink)}
  .live-updated{margin-top:8px; text-align:center; font-size:11px; color:var(--sub)}
  .cal-row.live{background:var(--live-row)}
  .cal-row.live .cal-time{color:var(--live-ink); font-weight:800}
  .sched-row.live{background:var(--live-row)}

  /* 第13弾: 試合詳細(得点/カード/交代)ドリルダウン。has-eventsが付いた行だけタップできる。 */
  .sched-row.has-events, .cal-row.has-events{cursor:pointer}
  .events-toggle{
    font-size:10px; color:var(--sub); text-align:center; transition:transform .15s ease; flex:none;
  }
  .events-toggle.open{transform:rotate(90deg); color:var(--accent)}
  /* 第15弾: ハイライト動画が既に埋め込み済みの試合行に付ける目印 */
  .video-mark{font-size:12px; flex:none; line-height:1}
  .events-panel{padding:2px 0 10px; animation:events-fade-in .15s ease}
  @keyframes events-fade-in{from{opacity:0} to{opacity:1}}
  .events-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
  .events-row{
    display:grid; grid-template-columns:30px 90px 1fr; align-items:center; gap:8px;
    font-size:12px; padding:4px 8px; border-radius:6px; background:var(--surface-1);
  }
  .events-row.me{background:var(--me-bg,#eaf6ef)}
  .events-minute{color:var(--sub); font-variant-numeric:tabular-nums; text-align:right}
  .events-club{color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .events-desc{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .events-sub{color:var(--sub); font-size:11px}
  .card-dot{display:inline-block; width:8px; height:11px; border-radius:2px; vertical-align:-1px}
  .card-dot.yellow{background:#eab308}
  .card-dot.red{background:#dc2626}
  /* 第23弾フェーズ2: JFA側は赤(退場)のアイコン名が未確認。黄とも赤とも断定せずグレーで出す。 */
  .card-dot.unknown{background:var(--sub)}

  /* 第13弾: 出場メンバー(スタメン)。ホーム/アウェイを2カラムで並べる。 */
  .lineups{margin-bottom:10px}
  .lineups-title{font-size:11px; font-weight:700; color:var(--sub); margin:0 0 6px}
  .lineups-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .lineups-col.me .lineups-team{color:var(--accent-on-light, inherit)}
  .lineups-team{font-size:12px; font-weight:700; margin-bottom:4px}
  .lineups-formation{font-size:11px; font-weight:400; color:var(--sub)}
  .lineups-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; font-size:12px}
  .lineups-num{display:inline-block; min-width:20px; color:var(--sub); font-variant-numeric:tabular-nums}
  /* 第14弾: 控えメンバー(スタメンより一段落ち着いた見た目にする) */
  .lineups-sub-title{font-size:10px; font-weight:700; color:var(--sub); margin:8px 0 3px}
  .lineups-bench{color:var(--sub)}
  .lineups-pos{display:inline-block; min-width:26px; font-size:10px; color:var(--sub)}
  /* 第22弾: 選手名リンク(Jリーグ公式の個人ページ)。地の文と見分けがつく程度に留め、下線はhoverのみ */
  .lineups-list a, .events-desc a{color:inherit; text-decoration:none; border-bottom:1px dotted var(--sub)}
  .lineups-list a:hover, .events-desc a:hover{text-decoration:none; border-bottom-style:solid}
  /* 第14弾: ハイライト動画(YouTube埋め込み、16:9のレスポンシブ) */
  .highlight-video{margin-bottom:10px}
  .highlight-video-source{font-size:11px; font-weight:normal; color:var(--sub)}
  .highlight-video-frame{position:relative; padding-top:56.25%; border-radius:8px; overflow:hidden; background:#000}
  .highlight-video-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
  /* 押した瞬間の反応。指の端末では:hoverが効かないので、押下状態だけは必ず返す。
     transformではなくopacityにしているのは、position:absoluteの子(帯・トースト)を持つ
     要素にtransformを掛けると座標基準がずれるため。 */
  button:active, a.btn:active, .btn-secondary:active, .cal-loadmore:active,
  .predict-row:active, .sched-row.has-events:active, .cal-row.has-events:active,
  .ec-row.has-events:active, .team-link:active{
    opacity:.6;
  }
  /* iOS/Androidの既定のタップ時グレー矩形は、上の指定と二重にちらつくので消す */
  button, a, .predict-row, .sched-row, .cal-row, .ec-row, .team-link{
    -webkit-tap-highlight-color:transparent;
  }
  /* 指のタップ領域の下限(44px, Apple HIG)。paddingを増やすのではなくmin-heightで
     下限だけ決め、中身はflexで中央に置く。既に44pxを超えている#tabbar/a.btnは対象外。 */
  .seg-toggle button, .stats-subtabs button, .chart-series-tabs button,
  .cal-league-filter button, .ec-rounds button, .chart-chip,
  .update-banner button,
  .btn-secondary, .cal-loadmore{
    min-height:44px; display:inline-flex; align-items:center; justify-content:center;
  }
  .btn-secondary, .cal-loadmore{display:flex}  /* 幅100%のものはblock相当のflexにする */
  /* 見た目は26px/35pxのまま、透明な当たり判定だけ44pxに広げる。
     ヘッダーはstickyで常時表示なので、実寸を増やすと本文の可視領域が恒久的に減る。 */
  .ondemand-info-btn, .theme-toggle-btn, .mode-toggle button{position:relative}
  .ondemand-info-btn::before, .theme-toggle-btn::before, .mode-toggle button::before{
    content:""; position:absolute; top:50%; left:50%;
    min-width:44px; min-height:44px; width:100%; height:100%;
    transform:translate(-50%,-50%);
  }
  /* フォーカスリングはクラブカラーに依存させない。クラブ色にすると、その色の背景の上で消える。
     :focus-visibleなので、マウス/タップでの押下時には出ない。 */
  button:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible{
    outline:3px solid var(--focus); outline-offset:2px; border-radius:6px;
  }
  @media (prefers-reduced-motion: reduce){
    .live-dot{animation:none}          /* 赤点は残す。点滅だけ止める */
    .events-panel{animation:none}
    .events-toggle{transition:none}
  }
  .skeleton{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--elev-1)}
  .skeleton-line{height:12px; border-radius:6px; background:var(--surface-2); margin-bottom:10px}
  .skeleton-line:last-child{margin-bottom:0; width:60%}
  @media (prefers-reduced-motion: no-preference){
    .skeleton-line{animation:skeleton-pulse 1.2s ease-in-out infinite}
    @keyframes skeleton-pulse{0%,100%{opacity:1} 50%{opacity:.5}}
  }
</style>

  <p class="muted">読み込み中…</p>
