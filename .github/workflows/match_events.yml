name: match_events

# 第13弾: 試合詳細(得点/カード/交代)ドリルダウン用の速報バッチ。
# 土日 JST 13:00〜22:55(=UTC 04:00〜13:55)の間、5分おきに走る。
# (cronはUTCで書くため "*/5 4-13 * * 6,0" になる)
#
# 土日限定にしているのは、J2/J3のキックオフがほぼ土日に集中しているため
# (J1の平日開催にはこのワークフローは対応しない。必要になったら曜日指定を見直す)。
#
# 実行のたびにActionsの分数を消費する(private repoの無料枠は月2000分、update.ymlだけで
# 既に約1120分/月を使っている)。このワークフローは概算で 月あたり約1000〜1100分
# (5分間隔×約10時間×土日×約4.3週)かかり、合計は無料枠をわずかに超える見込み。
# 超過はGitHub側の従量課金(Linuxで1分$0.008程度)になるだけで壊れはしないが、
# 気になる場合はcronの時間帯・間隔を調整すること。
#
# fetch_match_events.py自体はEVENTS_WINDOW_HOURS(36時間)以内にキックオフした試合だけを
# 対象にするので、無駄な全件取り直しにはならない。得点/カード/交代に実質的な変更が無い回は
# git_diff_match_events.pyでコミット自体をスキップし、Renderへの無駄なデプロイも防ぐ。

on:
  schedule:
    - cron: "*/5 4-13 * * 6,0"
  workflow_dispatch:

permissions:
  contents: write   # dataとdistをpushするために必要。これ以外は付けない

concurrency:
  group: match-events-batch
  cancel-in-progress: false   # 走行中のバッチを途中で殺さない(update.ymlとはグループを分けて独立させる)

jobs:
  match_events:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git_diff_match_events.py(git show HEAD:...)と後段のgit pull --rebaseのため

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: fetch_match_events
        run: python scripts/fetch_match_events.py --league all

      - name: Check for meaningful changes
        id: changes
        run: |
          if python scripts/git_diff_match_events.py data/processed/j1_match_events.json data/processed/j2_match_events.json data/processed/j3_match_events.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[info] 得点/カード/交代に実質的な変更なし。build_dist/コミットをスキップします"
          fi

      - name: build_dist
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/build_dist.py

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/processed dist

          if git diff --cached --quiet; then
            echo "変更なし(念のための二重チェック)"
            exit 0
          fi

          JST_TIME=$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')
          git commit -m "auto: 試合詳細速報更新 ${JST_TIME} JST"

          # ローカルPC/update.ymlからのpushと競合する前提で、push前に必ずrebaseする。失敗したら2回までリトライ。
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "push成功 (試行$i回目)"
              break
            fi
            echo "push失敗、リトライします ($i/3)"
            sleep 5
          done
