name: match_events

# 第13弾: 試合詳細(得点/カード/交代)ドリルダウン用の速報バッチ。
# 第14弾: 曜日限定・時間帯限定(土日13:00〜22:55)を撤廃し、毎日 JST 12:00〜23:55に拡大。
# 第15弾: 深夜〜早朝(JST 0:00〜11:55)も対象に加え、24時間・5分おきに変更。
# (cronはUTCで書くため "*/5 * * * *" になる)
#
# 第14弾での見直し理由: 当初は「J2/J3のキックオフがほぼ土日」「Actionsの無料枠(private repoは
# 月2000分)を超えないように」という理由で土日13:00〜22:55限定にしていたが、本リポジトリは
# 実際にはPublicだった(2026-08-22判明)。Public repoはGitHub-hosted runnerのActions分数が
# 無料枠の対象外(実質無制限)なので、この制約は不要と判断し撤廃した。
#
# 第15弾での見直し理由: JST 12:00〜23:55限定だと、23:55〜翌12:00の間にDAZNへ公開された
# ハイライト動画やeventsround.php側の更新(遅延反映など)を最大半日近く取りこぼす空白期間が
# あった。Public repoでActions分数の制約が無いこと、YouTube検索もクールダウン・試行回数
# 上限で無駄撃ちしない設計であることから、時間帯制限自体を撤廃し24時間化した。
#
# fetch_match_events.py自体はEVENTS_WINDOW_HOURS(36時間)以内にキックオフした試合だけを
# 対象にするので、無駄な全件取り直しにはならない。得点/カード/交代に実質的な変更が無い回は
# git_diff_match_events.pyでコミット自体をスキップし、Renderへの無駄なデプロイも防ぐ。
# DAZNハイライト検索(YouTube Data API)も試合ごとにクールダウン・試行回数上限があるので、
# 実行頻度を上げても無料枠(1日100検索)を無駄に消費しない(scripts/youtube_highlights.py参照)。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # dataとdistをpushするために必要。これ以外は付けない

concurrency:
  group: match-events-batch
  cancel-in-progress: false   # 走行中のバッチを途中で殺さない(update.ymlとはグループを分けて独立させる)

jobs:
  match_events:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git_diff_match_events.py(git show HEAD:...)と後段のgit pull --rebaseのため

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: fetch_match_events
        run: python scripts/fetch_match_events.py --league all
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Check for meaningful changes
        id: changes
        run: |
          if python scripts/git_diff_match_events.py data/processed/j1_match_events.json data/processed/j2_match_events.json data/processed/j3_match_events.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[info] 得点/カード/交代に実質的な変更なし。build_dist/コミットをスキップします"
          fi

      - name: build_dist
        if: steps.changes.outputs.changed == 'true'
        run: python scripts/build_dist.py

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/processed dist

          if git diff --cached --quiet; then
            echo "変更なし(念のための二重チェック)"
            exit 0
          fi

          JST_TIME=$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')
          git commit -m "auto: 試合詳細速報更新 ${JST_TIME} JST"

          # ローカルPC/update.ymlからのpushと競合する前提で、push前に必ずrebaseする。失敗したら2回までリトライ。
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "push成功 (試行$i回目)"
              break
            fi
            echo "push失敗、リトライします ($i/3)"
            sleep 5
          done
